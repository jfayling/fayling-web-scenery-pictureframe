          + skyAtmo(normalize(vec3f(0.0, 0.25, 1.0))) + skyAtmo(normalize(vec3f(0.0, 0.25, -1.0)))) * 0.25;
  // clouds overhead dim the open sky and add their own grey light
  let cover = clamp(F.cloudP.y * 0.8 + F.atmo.z * 0.3, 0.0, 1.0);
  let skyDim = 1.0 - 0.35 * cover;
  let glow = vec3f(0.002, 0.003, 0.005) * F.nightP.w;
  lt.zen = lt.zen * skyDim * sunScale + glow;
  lt.hor = lt.hor * skyDim * sunScale + glow;

  var col = vec3f(0.0);
  if (depth > 0.0) {
    // ---- water: lakes and the river ----
    var flow = vec2f(0.0);
    if (F.valley.z > 0.0) {
      let rw = riverHalfWidth(xz.y);
      let inRiver = 1.0 - smoothstep(1.1, 2.0, abs(riverOffset(xz)) / rw);
      flow = normalize(vec2f(riverDX(xz.y), 1.0)) * 0.9 * inRiver;
    }
    let t = F.camPos.w;
    let detail = 1.0 - smoothstep(0.6, 6.0, fp);
    let ocean = F.water.w > 0.5;
    let k1 = select(1.0 / 7.0, 1.0 / 48.0, ocean);
    let k2 = select(1.0 / 2.3, 1.0 / 13.0, ocean);
    let r1 = gnoised(xz * k1 - flow * t * k1 + vec2f(0.0, t * select(0.02, 0.006, ocean)));
    let r2 = gnoised(xz * k2 - flow * t * select(1.3, 0.55, ocean) * k2 + vec2f(t * select(0.05, 0.015, ocean), 0.0));
    var sl = r1.yz * select(0.021, 0.06, ocean) + r2.yz * select(0.018, 0.026, ocean) * detail;
    if (ocean) {
      let swell = gnoised(vec2f(xz.x * 0.0036 + t * 0.01, xz.y * 0.0024 + t * 0.003));
      sl += swell.yz * 0.1;
    }
    let n = normalize(vec3f(-sl.x, 1.0, -sl.y));
    // unresolved ripples widen the sun glint with distance
    let rough = 0.05 + 0.10 * smoothstep(0.5, 30.0, fp) + wet * 0.14;
    let NdV = max(dot(n, V), 1e-3);
    let Fr = schlick(NdV, 0.02);
    var R = reflect(-V, n);
    R.y = abs(R.y);
    var refl = textureSampleLevel(reflTex, sampR, skyMapUV(R), 0.0).rgb;
    // the wooded banks darken the reflection near the shore
    let bankK = (1.0 - smoothstep(0.2, 3.5, depth)) * smoothstep(0.0, 0.4, 1.0 - R.y);
    let bankCol = standAlbedo(0.5) * (lt.sun * sunVis * 0.25 + ambient(lt, Nt)) * (0.9 / PI);
    refl = mix(refl, bankCol, bankK * select(0.75, 0.12, ocean));
    let Hs = normalize(V + lt.L);
    let NdL = max(dot(n, lt.L), 0.0);
    var glint = lt.sun * sunVis * ggx(max(dot(n, Hs), 0.0), rough) * schlick(dot(V, Hs), 0.02) * NdL / (4.0 * NdV);
    let tannin = F.water.z;
    var deep = mix(vec3f(0.006, 0.016, 0.016), vec3f(0.016, 0.010, 0.004), tannin);
    var bed = groundAlbedo(xz, fp, 0.5, 0.0, 0.0, 0.0, 0.0) * mix(vec3f(0.7, 0.85, 0.8), vec3f(0.8, 0.6, 0.35), tannin);
    var extK = mix(vec3f(0.45, 0.16, 0.12), vec3f(0.35, 0.55, 0.9), tannin);
    if (ocean) {
      deep = vec3f(0.004, 0.026, 0.052);
      bed = vec3f(0.52, 0.44, 0.30) * (0.86 + 0.22 * snoise(xz * 0.03));
      extK = vec3f(0.15, 0.045, 0.03);
    }
    let path = depth * (1.0 + 1.0 / max(V.y, 0.15));
    let ext = exp(-path * extK);
    let lit = lt.sun * sunVis * max(lt.L.y, 0.0) + ambient(lt, vec3f(0.0, 1.0, 0.0));
    let body = (bed * ext + deep * (1.0 - ext)) * lit * (1.0 / PI);
    let ripple = xz * (0.45 + wet * 1.4) + vec2f(t * 2.1, -t * 0.6);
    let spark = pow(max(sin(ripple.x * 1.7) * sin(ripple.y * 1.3), 0.0), 12.0);
    glint += lt.sun * sunVis * spark * wet * 0.22;
    col = body * (1.0 - Fr) + refl * Fr + glint;
    if (ocean) {
      // a broken line of surf on the waterline, not across the whole shelf
      let band = 1.0 - smoothstep(0.12, 0.85, depth);
      let wash = smoothstep(0.05, 0.55, snoise(vec2f(xz.x * 0.08, xz.y * 0.02 - t * 0.4)));
      let foam = vec3f(0.72, 0.78, 0.8) * (lt.hor * 0.9 + lt.sun * sunVis * 0.1);
      col = mix(col, foam, band * wash * 0.55);
    }
  } else {
    // ---- land ----
    let sp = F.forest.y;
    // The crowns are instanced trees (trees.js). The ground carries what is between and
    // under them; once trees are too small to tell apart it carries the stand colour that
    // the trees themselves fade to.
    let farK = max(smoothstep(0.35 * sp, 1.0 * sp, fp), smoothstep(0.8 * ${TREE_RANGE}.0, ${TREE_RANGE}.0, dist));
    let gAlb = groundAlbedo(xz, fp, above, dens, M.z, M.w, curv);
    var Ng = Nt;
    if (fp < 4.0) {
      let b = gnoised(xz * (1.0 / 5.0) + vec2f(3.0, 3.0)).yz * 0.12 * (1.0 - smoothstep(1.0, 4.0, fp));
      Ng = normalize(Nt + vec3f(-b.x, 0.0, -b.y));
    }
    // valleys and hollows collect less sky light
    let aoT = clamp(1.0 + curv * 4.0, 0.6, 1.0);
    var nearC = vec3f(0.0);
    if (farK < 1.0 && F.forest.x > 0.0) {
      let uy = understoryH(dens);
      let sh = canopyShadow(uy, lt.L, dens);
      // under and between crowns: little sky reaches the floor or the understory
      let ao = mix(1.0, 0.28, smoothstep(0.0, 0.8, dens)) * aoT;
      let uK = smoothstep(0.5, 2.0, uy);
      let under = mix(standAlbedo(1.0), standAlbedo(conif), 0.4) * 0.75;
      let alb = mix(gAlb, under, uK);
      let n = normalize(mix(Ng, vec3f(0.0, 1.0, 0.0), uK));
      nearC = alb * (direct(lt, n, sh * sunVis) + ambient(lt, n) * ao);
    }
    var farCol = vec3f(0.0);
    if (farK > 0.0 || F.forest.x <= 0.0) {
      // Statistical canopy: closure, the fraction of visible foliage that is sunlit
      // (the hotspot: with the sun behind the camera the shadows hide behind the crowns),
      // and the floor showing through the gaps.
      let closure = 1.0 - exp(-2.8 * dens);
      let g = acos(clamp(dot(V, lt.L), -1.0, 1.0));
      let litBase = clamp(0.22 + 0.5 * lt.L.y + 0.22 * V.y, 0.0, 1.0);
      let lit = mix(litBase, 1.0, exp(-g * 3.5));
      let standN = normalize(mix(Nt, vec3f(0.0, 1.0, 0.0), 0.35));
      // crowns stand up out of the ground, so a low sun still lights their sides
      let side = sqrt(max(1.0 - lt.L.y * lt.L.y, 0.0)) * smoothstep(-0.02, 0.1, lt.L.y);
      let crownCos = max(dot(standN, lt.L), 0.0) * 0.75 + side * mix(0.3, 0.4, conif);
      let stand = standAlbedoAt(xz, conif) * (lt.sun * sunVis * lit * crownCos
                + lt.moon * max(dot(standN, lt.M), 0.0) + ambient(lt, standN) * 0.7 * aoT);
      let gapLit = mix(1.0, lit * 0.35, closure);
      let floorC = gAlb * (direct(lt, Nt, sunVis * gapLit) + ambient(lt, Nt) * mix(1.0, 0.3, closure) * aoT);
      farCol = mix(floorC, stand, closure);
    }
    col = select(mix(nearC, farCol, farK), farCol, F.forest.x <= 0.0) * (1.0 / PI);
    // A water film darkens foliage and rock and lifts the leaf sheen.
    col *= mix(1.0, 0.72, wet);
    let sheen = pow(max(dot(normalize(V + lt.L), Ng), 0.0), 18.0) * wet * sunVis;
    col += lt.sun * sheen * 0.015;
  }

  // ---- valley mist ----
  if (F.mist.x > 0.0) {
    let top = wl + F.mist.y;
    let py = F.camPos.y + in.rel.y;
    let below = max(top - py, 0.0);
    if (below > 0.0) {
      // drifting banks of valley fog with clear gaps between them
      let pn = fbm2(xz * (1.0 / 520.0) + vec2f(F.camPos.w * 0.004, 1.0), 2) * 0.5 + 0.5;
      let thick = F.mist.x * 0.0022 * smoothstep(0.5, 0.85, pn) * smoothstep(0.0, F.mist.y * 0.6, below);
      let camIn = max(top - F.camPos.y, 0.0);
      let path = min((below - camIn) / max(V.y, 0.04), dist);
      let Tm = exp(-thick * max(path, 0.0));
      let cosT = dot(-V, lt.L);
      let ph = mix(phaseHG(cosT, 0.6), phaseHG(cosT, -0.1), 0.5) * 4.0 * PI;
      let mistCol = lt.sun * cloudSh * sunUp * ph * 0.16 + (lt.zen * 0.6 + lt.hor * 0.4) * 0.9 + lt.moon * 0.3;
      col = col * Tm + mistCol * (1.0 - Tm);
    }
  }

  // ---- precipitation between the camera and the valley ----
  if (Rain.wind.w > 0.004) {
    let snow = Rain.amt.y;
    let thick = Rain.wind.w * mix(0.00042, 0.00018, snow);
    let Tm = exp(-thick * dist);
    let fogCol = mix(vec3f(0.58, 0.63, 0.7), vec3f(0.86, 0.89, 0.93), snow);
    var litFog = (lt.zen * 0.62 + lt.hor * 0.38) * mix(0.5, 0.85, snow);
    litFog += vec3f(0.62, 0.72, 0.95) * Rain.amt.z * 0.9;
    col = col * Tm + fogCol * litFog * (1.0 - Tm);
    if (Rain.bolt.w > 0.5) {
      col += vec3f(0.42, 0.52, 0.78) * Rain.amt.z * (0.35 + 0.65 * max(Nt.y, 0.0));
    }
  }

  // ---- aerial perspective ----
  let uv = in.pos.xy * F.screen.zw;
  let zc = sqrt(dist * 0.001 / AP_MAX) * AP_N - 1.0;
  let w = clamp(zc + 1.0, 0.0, 1.0);
  let ap = textureSampleLevel(apTex, sampC, vec3f(uv, (max(zc, 0.0) + 0.5) / AP_N), 0.0);
  let T = mix(1.0, ap.a, w);
  col = col * T + ap.rgb * F.sunDir.w * w;

  if (F.post.w > 0.5) {
    if (F.post.w < 1.5) { return vec4f(M.xyz * 0.3, 1.0); }
    if (F.post.w < 2.5) { return vec4f(vec3f(fract(lf * 0.999), f32(i32(lf) % 2), 0.0) * 0.25, 1.0); }
    if (F.post.w < 3.5) { return vec4f(vec3f(sunVis) * 0.3, 1.0); }
    return vec4f(Nt * 0.5 + 0.5, 1.0) * 0.3;
  }
  return vec4f(col, 1.0);
}
`;
}

// ---- js/wgsl/trees.js ----
// Instanced trees. A compute pass walks the jittered tree grid around the camera, keeps the
// trees that can be on screen and appends them to a near list (full crown) and a far list
// (cheap crown) that two indirect draws consume. Every tree is real geometry at every distance,
// so flying forward never grows or inserts a tree; a crown that shrinks below a pixel is only
// recoloured towards the stand colour the ground already carries.





const TREE_INST_BYTES = 80;
const TREE_GEN_GROUP = 8;
const TREE_SEGS_NEAR = 12;
const TREE_SEGS_FAR = 6;
// vertices per crown: an apex fan and a shoulder-to-base band near, a single fan far
const TREE_VERTS_NEAR = TREE_SEGS_NEAR * 9;
const TREE_VERTS_FAR = TREE_SEGS_FAR * 3;

const TREE_CONSTS = /* wgsl */ `
const TREE_RANGE: f32 = ${TREE_RANGE}.0;
const TREE_NEAR_DIST: f32 = ${TREE_NEAR_DIST}.0;
const TREE_MAX: u32 = ${TREE_MAX}u;
const TREE_NEAR_MAX: u32 = ${TREE_NEAR_MAX}u;
const EARTH_R: f32 = 6371000.0;
const TREE_SEGS_NEAR: u32 = ${TREE_SEGS_NEAR}u;
const TREE_SEGS_FAR: u32 = ${TREE_SEGS_FAR}u;
struct TreeInst {
  a: vec4f,   // xyz = ground position of the trunk, w = crown radius
  b: vec4f,   // x = apex height, y = lowest crown edge, z = texture seed, w = 1 for conifers
  c: vec4f,   // x = sun visibility, y = cloud shade * sun up, z = stand density, w = conifer share
  d: vec4f,   // lit stand colour (radiance / pi), what a sub-pixel crown shows
  e: vec4f,   // this tree's foliage albedo
};
struct Light { sun: vec3f, moon: vec3f, zen: vec3f, hor: vec3f, L: vec3f, M: vec3f };
@group(0) @binding(10) var<storage, read> LB: array<vec4f, 8>;
fn readLight() -> Light {
  var lt: Light;
  lt.sun = LB[0].xyz; lt.moon = LB[1].xyz; lt.zen = LB[2].xyz;
  lt.hor = LB[3].xyz; lt.L = LB[4].xyz; lt.M = LB[5].xyz;
  return lt;
}
fn ggx(nh: f32, a: f32) -> f32 {
  let a2 = a * a;
  let d = nh * nh * (a2 - 1.0) + 1.0;
  return a2 / (PI * d * d);
}
fn ambient(lt: Light, n: vec3f) -> vec3f {
  return mix(lt.hor, lt.zen, 0.5 + 0.5 * n.y) * (0.55 + 0.45 * n.y) * PI;
}
fn direct(lt: Light, n: vec3f, sunVis: f32) -> vec3f {
  return lt.sun * sunVis * max(dot(n, lt.L), 0.0) + lt.moon * max(dot(n, lt.M), 0.0);
}
`;

// One thread: the light every tree shares this frame (sun and moon illuminance, sky colour).
function treeLightWGSL() {
  return FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var skyLUT: texture_2d<f32>;
@group(0) @binding(3) var sampC: sampler;
` + RAIN_STRUCT + /* wgsl */ `
@group(0) @binding(4) var<uniform> Rain: RainU;
@group(0) @binding(5) var<storage, read_write> outL: array<vec4f, 8>;
` + SKY_RENDER_FUNCS + /* wgsl */ `
fn moonIlluminance() -> vec3f {
  if (F.moonDir.w <= 0.0 || F.moonDir.y <= 0.0 || F.sunDir.y >= 0.2) { return vec3f(0.0); }
  let moon = normalize(F.moonDir.xyz);
  let lite = normalize(F.moonLight.xyz);
  let deg = acos(clamp(dot(lite, -moon), -1.0, 1.0)) * (180.0 / PI);
  let deg2 = deg * deg;
  let phase = exp(-0.921034037 * (0.026 * deg + 4e-9 * deg2 * deg2));
  let night = 1.0 - smoothstep(-0.05, 0.18, F.sunDir.y);
  let size = max(F.moonLight.w, 0.0) / 2.5;
  let E = F.moonDir.w * phase * night * 0.028 * size * size;
  return vec3f(1.0, 0.96, 0.9) * sampleTrans(camR(), moon.y) * E;
}
@compute @workgroup_size(1)
fn main() {
  let L = F.sunDir.xyz;
  let sunScale = mix(1.0, Rain.atmo.y, step(0.001, Rain.wind.w));
  let sun = sampleTrans(RG + F.lodP.z * 0.001, L.y) * F.sunDir.w * sunScale;
  var zen = skyAtmo(vec3f(0.0, 1.0, 0.0));
  var hor = (skyAtmo(normalize(vec3f(1.0, 0.25, 0.0))) + skyAtmo(normalize(vec3f(-1.0, 0.25, 0.0)))
          + skyAtmo(normalize(vec3f(0.0, 0.25, 1.0))) + skyAtmo(normalize(vec3f(0.0, 0.25, -1.0)))) * 0.25;
  let cover = clamp(F.cloudP.y * 0.8 + F.atmo.z * 0.3, 0.0, 1.0);
  let skyDim = 1.0 - 0.35 * cover;
  let glow = vec3f(0.002, 0.003, 0.005) * F.nightP.w;
  zen = zen * skyDim * sunScale + glow;
  hor = hor * skyDim * sunScale + glow;
  outL[0] = vec4f(sun, 0.0);
  outL[1] = vec4f(moonIlluminance(), 0.0);
  outL[2] = vec4f(zen, 0.0);
  outL[3] = vec4f(hor, 0.0);
  outL[4] = vec4f(L, 0.0);
  outL[5] = vec4f(normalize(F.moonDir.xyz), 0.0);
}
`;
}

// Walks the cells in a square around the camera. Writes the trees that survive the range,
// water, frustum and stand tests, with their lighting already folded in.
function treeGenWGSL(filterA) {
  return FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var sampC: sampler;
@group(0) @binding(2) var clipA: texture_2d_array<f32>;
@group(0) @binding(3) var clipB: texture_2d_array<f32>;
@group(0) @binding(4) var<uniform> CL: ClipLevels;
struct ShadowMap { origin: vec2f, texel: f32, span: f32 };
@group(0) @binding(5) var cloudShadowTex: texture_2d<f32>;
@group(0) @binding(6) var<uniform> SH: ShadowMap;
struct GenU { cell0: vec2i, dim: u32, pad: u32 };
@group(0) @binding(7) var<uniform> G: GenU;
@group(0) @binding(8) var<storage, read_write> trees: array<TreeInst>;
@group(0) @binding(9) var<storage, read_write> args: array<atomic<u32>, 8>;
` + NOISE_WGSL + TERRAIN_FUNCS + clipSampleWGSL(filterA) + FOREST_FUNCS + TREE_CONSTS + /* wgsl */ `
fn terrainShadow(p: vec3f, L: vec3f) -> f32 {
  if (L.y > 0.8) { return 1.0; }
  let ceiling = waterLevel(p.z) + F.valley.w + F.relief.x * (1.5 - F.biome.z) + 40.0;
  var t = 30.0;
  var res = 1.0;
  for (var i = 0; i < 8; i++) {
    let q = p + L * t;
    if (q.y > ceiling) { break; }
    let texel = max(t * 0.22, 24.0);
    let lf = clamp(log2(texel / CLIP_T0), 0.0, f32(CLIP_L - 1));
    let h = clipHeight(q.xz, ceil(lf));
    let gap = q.y - h;
    res = min(res, gap / (t * 0.05) + 0.5);
    if (res <= 0.0) { return 0.0; }
    t *= 1.72;
  }
  return smoothstep(0.0, 1.0, res);
}
fn cloudShade(world: vec3f) -> f32 {
  if (F.cloudP.w <= 0.001 || F.sunDir.y <= 0.0) { return 1.0; }
  let uv = (world.xz - SH.origin) / SH.span;
  let edge = smoothstep(0.0, 0.03, uv.x) * smoothstep(0.0, 0.03, uv.y)
           * smoothstep(0.0, 0.03, 1.0 - uv.x) * smoothstep(0.0, 0.03, 1.0 - uv.y);
  let s = textureSampleLevel(cloudShadowTex, sampC, clamp(uv, vec2f(0.001), vec2f(0.999)), 0.0).r;
  return mix(1.0, s, edge);
}

@compute @workgroup_size(${TREE_GEN_GROUP}, ${TREE_GEN_GROUP}, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= G.dim || id.y >= G.dim) { return; }
  if (F.forest.x <= 0.0) { return; }
  let cell = G.cell0 + vec2i(id.xy);
  let sp = F.forest.y;
  // trunk position and the cheap range test first: most cells stop here
  let h0 = pcgHash((u32(cell.x) * 73856093u) ^ (u32(cell.y) * 19349663u + seedU() + 0x5bd1e995u));
  let pos = (vec2f(cell) + 0.5 + (vec2f(unit16(h0), unit16(h0 >> 16u)) - 0.5) * 0.8) * sp;
  let relH = pos - F.camPos.xz;
  let d2 = dot(relH, relH);
  if (d2 > TREE_RANGE * TREE_RANGE) { return; }
  let dist = sqrt(d2);
  // stand mask first, it is one texture read
  let m = treeMasks(pos);
  if (m.x < 0.02) { return; }
  let t = treeCell(cell, false, m.x, m.y);
  if (!t.ok) { return; }
  // Ground under the trunk, at the same continuous level the terrain mesh uses. A stepped
  // level made every tree grow or sink as the level boundary swept past it.
  let d3 = distance(vec3f(pos.x, F.lodP.z, pos.y), F.camPos.xyz);
  let lod = clamp(ceil(log2(max(d3, 1.0) / F.lodP.x)), 0.0, 9.0);
  let range = F.lodP.x * exp2(lod);
  let spacing = (F.lodP.x / (16.0 * F.lodP.y)) * exp2(lod);
  let morph = clamp((d3 - 0.8 * range) / (0.2 * range), 0.0, 1.0);
  let lv = clamp(max(clipFinest(pos), log2(spacing * (1.0 + morph) / CLIP_T0)), 0.0, f32(CLIP_L - 1));
  let gy = clipHeight(pos, lv);
  if (gy <= waterLevel(pos.y) + 0.2) { return; }
  // frustum, padded by the size of the crown
  let R = max(t.r * 1.3, 2.0) + t.top * 0.5;
  let rel = vec3f(pos.x - F.camPos.x, gy + t.top * 0.5 - F.camPos.y, pos.y - F.camPos.z);
  let z = dot(rel, F.camFwd.xyz);
  if (z < -R) { return; }
  if (z > R) {
    let tx = length(F.camRight.xyz);
    let ty = length(F.camUp.xyz);
    let nx = abs(dot(rel, F.camRight.xyz)) / (tx * tx * z);
    let ny = abs(dot(rel, F.camUp.xyz)) / (ty * ty * z);
    if (nx > 1.05 + R / (z * tx) || ny > 1.05 + R / (z * ty)) { return; }
  }

  // light this tree sees
  var lt = readLight();
  let ground = vec3f(pos.x, gy, pos.y);
  let sunUp = smoothstep(-0.015, 0.02, lt.L.y);
  var sunVis = 0.0;
  var cloudSh = 1.0;
  if (sunUp > 0.0) {
    cloudSh = cloudShade(ground);
    sunVis = terrainShadow(ground + vec3f(0.0, 2.0, 0.0), lt.L) * cloudSh * sunUp;
  }
  // the stand this tree belongs to, lit the way the far ground is lit
  let V = normalize(F.camPos.xyz - vec3f(pos.x, gy + t.top * 0.6, pos.y));
  let g = acos(clamp(dot(V, lt.L), -1.0, 1.0));
  let litBase = clamp(0.22 + 0.5 * lt.L.y + 0.22 * V.y, 0.0, 1.0);
  let lit = mix(litBase, 1.0, exp(-g * 3.5));
  let side = sqrt(max(1.0 - lt.L.y * lt.L.y, 0.0)) * smoothstep(-0.02, 0.1, lt.L.y);
  let crownCos = max(lt.L.y, 0.0) * 0.75 + side * mix(0.3, 0.4, m.y);
  let up = vec3f(0.0, 1.0, 0.0);
  let stand = standAlbedoAt(pos, m.y) * (lt.sun * sunVis * lit * crownCos
            + lt.moon * max(dot(up, lt.M), 0.0) + ambient(lt, up) * 0.7) * (1.0 / PI);
  let alb = treeAlbedo(t);

  var inst: TreeInst;
  inst.a = vec4f(pos.x, gy, pos.y, t.r);
  inst.b = vec4f(t.top, t.base, t.seed, select(0.0, 1.0, t.conifer));
  inst.c = vec4f(sunVis, cloudSh * sunUp, m.x, m.y);
  inst.d = vec4f(stand, 0.0);
  inst.e = vec4f(alb, 0.0);
  if (dist < TREE_NEAR_DIST) {
    let i = atomicAdd(&args[1], 1u);
    if (i < TREE_NEAR_MAX) { trees[i] = inst; }
  } else {
    let j = atomicAdd(&args[5], 1u);
    if (j < TREE_MAX - TREE_NEAR_MAX) { trees[TREE_MAX - 1u - j] = inst; }
  }
}
`;
}

// Crowns. The near list is a twelve-sided cone in three rings (apex, shoulder, base), the far
// list a single six-triangle fan. Both are shaded from the same analytic cone or dome the old
// per-pixel crowns used.
function treeDrawWGSL() {
  return FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(2) var<storage, read> trees: array<TreeInst>;
@group(0) @binding(3) var apTex: texture_3d<f32>;
@group(0) @binding(4) var sampC: sampler;
` + RAIN_STRUCT + /* wgsl */ `
@group(0) @binding(5) var<uniform> Rain: RainU;
` + NOISE_WGSL + TERRAIN_FUNCS + TREE_CONSTS + /* wgsl */ `
const AP_N: f32 = ${AP_RES}.0;
const AP_MAX: f32 = ${AP_MAX_KM}.0;
override FAR: bool = false;

struct VOut {
  @builtin(position) pos: vec4f,
  @location(0) rel: vec3f,
  @location(1) dv: vec2f,
  @location(2) @interpolate(flat) ti: u32,
};

@vertex fn vs(@builtin(vertex_index) vi: u32, @builtin(instance_index) ii: u32) -> VOut {
  var o: VOut;
  o.pos = vec4f(2.0, 2.0, 2.0, 1.0);   // outside the clip volume: the triangle is discarded
  o.rel = vec3f(0.0);
  o.dv = vec2f(0.0);
  o.ti = 0u;
  var ti = ii;
  if (FAR) {
    if (ii >= TREE_MAX - TREE_NEAR_MAX) { return o; }
    ti = TREE_MAX - 1u - ii;
  } else if (ii >= TREE_NEAR_MAX) {
    return o;
  }
  let I = trees[ti];
  let top = I.b.x;
  let base = I.b.y;
  let conifer = I.b.w > 0.5;
  let span = max(top - base, 0.5);
  let centre = vec3f(I.a.x, I.a.y, I.a.z);
  // True crown radius at every distance. Enlarging small crowns to a minimum pixel size
  // made them shrink back to their real width as the camera approached, a ripple of
  // growing and shrinking that travelled through the forest.
  let r = I.a.w;

  let tri = vi / 3u;
  let k = vi % 3u;
  var ring = 0u;     // 0 apex, 1 shoulder, 2 base
  var si = 0u;
  let segs = select(TREE_SEGS_NEAR, TREE_SEGS_FAR, FAR);
  if (FAR) {
    if (k > 0u) { ring = 2u; si = tri + k - 1u; }
  } else if (tri < segs) {
    if (k > 0u) { ring = 1u; si = tri + k - 1u; }
  } else {
    let q = tri - segs;
    let i = q >> 1u;
    if ((q & 1u) == 0u) {
      if (k == 0u) { ring = 1u; si = i; } else { ring = 2u; si = i + select(0u, 1u, k == 2u); }
    } else {
      if (k == 0u) { ring = 1u; si = i; } else if (k == 1u) { ring = 2u; si = i + 1u; } else { ring = 1u; si = i + 1u; }
    }
  }
  // normalised radius and the crown height there
  var u = 0.0;
  if (ring == 1u) { u = select(0.62, 0.5, conifer); }
  if (ring == 2u) { u = 1.0; }
  var y = top;
  if (ring > 0u) {
    y = select(base + span * (1.0 - u * u), top - span * pow(u, 0.85), conifer);
  }
  let seed = I.b.z;
  let a = f32(si % segs) * (6.2831853 / f32(segs)) + seed * 0.37;
  // A polygon with the area of the round crown. Trimming a larger one to the circle in the
  // fragment shader (discard) turned off early depth testing, and every crown hidden behind
  // the first one was shaded as well.
  let rad = u * r * select(1.023, 1.0996, FAR);
  let dv = vec2f(cos(a), sin(a)) * rad;
  var rel = vec3f(centre.x + dv.x, centre.y + y, centre.z + dv.y) - F.camPos.xyz;
  rel.y -= dot(rel.xz, rel.xz) / (2.0 * EARTH_R);
  o.rel = rel;
  o.pos = F.viewProj * vec4f(rel, 1.0);
  o.dv = dv;
  o.ti = ti;
  return o;
}

@fragment fn fs(in: VOut) -> @location(0) vec4f {
  let I = trees[in.ti];
  let fp = max(length(dpdx(in.dv)), length(dpdy(in.dv)));
  let dist = length(in.rel);
  let V = -in.rel / dist;
  let conifer = I.b.w > 0.5;
  let top = I.b.x;
  let base = I.b.y;
  let r = I.a.w;
  let span = max(top - base, 0.5);
  let sunVis = I.c.x;
  let cloudSu = I.c.y;
  let dens = I.c.z;
  var lt = readLight();

  // how much of this crown is still a crown: below a pixel it is the stand colour
  let kS = smoothstep(0.6, 2.2, fp / max(r, 0.1));
  var col = I.d.xyz;
  let d = max(length(in.dv), 1e-3);
  if (kS < 0.999) {
    let x = clamp(d / r, 0.02, 1.0);
    var yc: f32;
    var dydd: f32;
    if (conifer) {
      let px = pow(x, 0.85);
      yc = top - span * px;
      dydd = -span * 0.85 * px / (x * r);
    } else {
      yc = base + span * (1.0 - x * x);
      dydd = -span * 2.0 * x / r;
    }
    let cg = in.dv / d * dydd;
    // crown texture: branch tufts on conifers, lumpy foliage clusters on broadleaves
    let kd = 1.0 - smoothstep(0.08 * r, 0.45 * r, fp);
    let bf = 1.0 / (r * select(0.3, 0.22, conifer));
    let arc = d + max(top - yc, 0.0) * 0.8;
    let q = in.dv * (arc / d) * bf + vec2f(I.b.z * 1.37, I.b.z * 0.71);
    var b1 = vec3f(0.0);
    var b2 = vec3f(0.0);
    if (kd > 0.01) {
      b1 = gnoised(q);
      b2 = gnoised(q * 2.3 + vec2f(5.1, 2.7));
    }
    let amp = span * select(0.16, 0.10, conifer) * kd;
    let bump = (b1.yz + b2.yz * 2.3 * 0.5) * bf * amp;
    let gw = cg + bump;
    let nC = normalize(vec3f(-gw.x, 1.0, -gw.y));
    let yb = yc + (b1.x + b2.x * 0.5) * amp;
    let depthK = clamp((yb - base) / max(span, 1.0), 0.0, 1.0);
    let ao = (0.45 + 0.55 * depthK) * clamp(1.0 + (b1.x + 0.5 * b2.x) * 0.8 * kd, 0.5, 1.2);
    // a closed stand shades its lower crowns
    let sunk = smoothstep(-0.02, 0.35, lt.L.y);
    let shDepth = smoothstep(max(F.forest.z, 1.0) * 0.95, max(F.forest.z, 1.0) * 0.2, yb) * smoothstep(0.05, 0.5, dens);
    let sh = select(1.0, clamp(1.0 - shDepth * mix(0.78, 0.34, sunk), 0.0, 1.0), dens > 0.004);
    let alb = I.e.xyz;
    let trans = select(0.35, 0.18, conifer) * max(-dot(nC, lt.L), 0.0) * (1.0 - depthK * 0.6);
    let Hs = normalize(V + lt.L);
    let spec = select(0.010, 0.005, conifer) * ggx(max(dot(nC, Hs), 0.0), 0.5) * max(dot(nC, lt.L), 0.0)
             / max(dot(nC, V), 0.2);
    let own = (alb * (direct(lt, nC, sh * sunVis) + lt.sun * sh * sunVis * trans + ambient(lt, nC) * ao)
             + lt.sun * sh * sunVis * spec * PI) * (1.0 / PI);
    col = mix(own, col, kS);
  }
  col *= mix(1.0, 0.72, Rain.amt.x);

  // valley mist, precipitation and aerial perspective, as for the ground
  let xz = vec2f(I.a.x, I.a.z) + in.dv;
  let wl = waterLevel(xz.y);
  if (F.mist.x > 0.0) {
    let topM = wl + F.mist.y;
    let py = F.camPos.y + in.rel.y;
    let below = max(topM - py, 0.0);
    if (below > 0.0) {
      let pn = fbm2(xz * (1.0 / 520.0) + vec2f(F.camPos.w * 0.004, 1.0), 2) * 0.5 + 0.5;
      let thick = F.mist.x * 0.0022 * smoothstep(0.5, 0.85, pn) * smoothstep(0.0, F.mist.y * 0.6, below);
      let camIn = max(topM - F.camPos.y, 0.0);
      let path = min((below - camIn) / max(V.y, 0.04), dist);
      let Tm = exp(-thick * max(path, 0.0));
      let cosT = dot(-V, lt.L);
      let ph = mix(phaseHG(cosT, 0.6), phaseHG(cosT, -0.1), 0.5) * 4.0 * PI;
      let mistCol = lt.sun * cloudSu * ph * 0.16 + (lt.zen * 0.6 + lt.hor * 0.4) * 0.9 + lt.moon * 0.3;
      col = col * Tm + mistCol * (1.0 - Tm);
    }
  }
  if (Rain.wind.w > 0.004) {
    let snow = Rain.amt.y;
    let thick = Rain.wind.w * mix(0.00042, 0.00018, snow);
    let Tm = exp(-thick * dist);
    let fogCol = mix(vec3f(0.58, 0.63, 0.7), vec3f(0.86, 0.89, 0.93), snow);
    var litFog = (lt.zen * 0.62 + lt.hor * 0.38) * mix(0.5, 0.85, snow);
    litFog += vec3f(0.62, 0.72, 0.95) * Rain.amt.z * 0.9;
    col = col * Tm + fogCol * litFog * (1.0 - Tm);
    if (Rain.bolt.w > 0.5) { col += vec3f(0.42, 0.52, 0.78) * Rain.amt.z * 0.6; }
  }
  let uv = in.pos.xy * F.screen.zw;
  let zc = sqrt(dist * 0.001 / AP_MAX) * AP_N - 1.0;
  let w = clamp(zc + 1.0, 0.0, 1.0);
  let ap = textureSampleLevel(apTex, sampC, vec3f(uv, (max(zc, 0.0) + 0.5) / AP_N), 0.0);
  let T = mix(1.0, ap.a, w);
  col = col * T + ap.rgb * F.sunDir.w * w;
  return vec4f(col, 1.0);
}
`;
}

// ---- js/wgsl/post.js ----
// Bloom (dual-filter chain) and final composite with AgX tonemapping.
const FS_TRI = /* wgsl */ `
struct VO { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
@vertex fn vs(@builtin(vertex_index) i: u32) -> VO {
  let p = vec2f(f32((i << 1u) & 2u), f32(i & 2u));
  var o: VO;
  o.pos = vec4f(p * 2.0 - 1.0, 0.0, 1.0);
  o.uv = vec2f(p.x, 1.0 - p.y);
  return o;
}
`;

const BLOOM_DOWN = FS_TRI + /* wgsl */ `
struct P { texel: vec4f };   // xy = 1/src size, z = first pass (karis + threshold)
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> U: P;
fn luma(c: vec3f) -> f32 { return dot(c, vec3f(0.2126, 0.7152, 0.0722)); }
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(src, samp, uv, 0.0).rgb; }
fn karis(c: vec3f) -> f32 { return 1.0 / (1.0 + luma(c) * 0.25); }
@fragment fn fs(in: VO) -> @location(0) vec4f {
  let t = U.texel.xy;
  let uv = in.uv;
  let a = tap(uv + t * vec2f(-2.0, -2.0));
  let b = tap(uv + t * vec2f(0.0, -2.0));
  let c = tap(uv + t * vec2f(2.0, -2.0));
  let d = tap(uv + t * vec2f(-2.0, 0.0));
  let e = tap(uv);
  let f = tap(uv + t * vec2f(2.0, 0.0));
  let g = tap(uv + t * vec2f(-2.0, 2.0));
  let h = tap(uv + t * vec2f(0.0, 2.0));
  let i = tap(uv + t * vec2f(2.0, 2.0));
  let j = tap(uv + t * vec2f(-1.0, -1.0));
  let k = tap(uv + t * vec2f(1.0, -1.0));
  let l = tap(uv + t * vec2f(-1.0, 1.0));
  let m = tap(uv + t * vec2f(1.0, 1.0));
  var o: vec3f;
  if (U.texel.z > 0.5) {
    // Karis average on the first downsample to tame fireflies from sun glints
    let g0 = (a + b + d + e) * 0.25;
    let g1 = (b + c + e + f) * 0.25;
    let g2 = (d + e + g + h) * 0.25;
    let g3 = (e + f + h + i) * 0.25;
    let g4 = (j + k + l + m) * 0.25;
    let w0 = karis(g0) * 0.125; let w1 = karis(g1) * 0.125; let w2 = karis(g2) * 0.125;
    let w3 = karis(g3) * 0.125; let w4 = karis(g4) * 0.5;
    o = (g0 * w0 + g1 * w1 + g2 * w2 + g3 * w3 + g4 * w4) / (w0 + w1 + w2 + w3 + w4);
  } else {
    o = e * 0.125 + (a + c + g + i) * 0.03125 + (b + d + f + h) * 0.0625 + (j + k + l + m) * 0.125;
  }
  return vec4f(min(o, vec3f(6.0e4)), 1.0);
}
`;

const BLOOM_UP = FS_TRI + /* wgsl */ `
struct P { texel: vec4f };   // xy = 1/src size, z = radius, w = weight
@group(0) @binding(0) var src: texture_2d<f32>;
@group(0) @binding(1) var samp: sampler;
@group(0) @binding(2) var<uniform> U: P;
fn tap(uv: vec2f) -> vec3f { return textureSampleLevel(src, samp, uv, 0.0).rgb; }
@fragment fn fs(in: VO) -> @location(0) vec4f {
  let t = U.texel.xy * U.texel.z;
  let uv = in.uv;
  var o = tap(uv) * 4.0;
  o += (tap(uv + vec2f(-t.x, 0.0)) + tap(uv + vec2f(t.x, 0.0)) + tap(uv + vec2f(0.0, -t.y)) + tap(uv + vec2f(0.0, t.y))) * 2.0;
  o += tap(uv + vec2f(-t.x, -t.y)) + tap(uv + vec2f(t.x, -t.y)) + tap(uv + vec2f(-t.x, t.y)) + tap(uv + vec2f(t.x, t.y));
  return vec4f(o * (U.texel.w / 16.0), 1.0);
}
`;

const COMPOSITE = FS_TRI + /* wgsl */ `
struct P { p: vec4f, q: vec4f };  // p: exposure, bloom, frame, vignette; q: saturation, contrast, warmth, sharpen
@group(0) @binding(0) var hdr: texture_2d<f32>;
@group(0) @binding(1) var bloom: texture_2d<f32>;
@group(0) @binding(2) var samp: sampler;
@group(0) @binding(3) var<uniform> U: P;

fn agxContrast(x: vec3f) -> vec3f {
  let x2 = x * x;
  let x4 = x2 * x2;
  return 15.5 * x4 * x2 - 40.14 * x4 * x + 31.96 * x4 - 6.868 * x2 * x + 0.4298 * x2 + 0.1191 * x - 0.00232;
}
fn agx(v: vec3f) -> vec3f {
  let m = mat3x3f(0.842479062253094, 0.0423282422610123, 0.0423756549057051,
                  0.0784335999999992, 0.878468636469772, 0.0784336,
                  0.0792237451477643, 0.0791661274605434, 0.879142973793104);
  let minEv = -12.47393;
  let maxEv = 4.026069;
  var x = m * max(v, vec3f(1e-10));
  x = clamp(log2(x), vec3f(minEv), vec3f(maxEv));
  x = (x - minEv) / (maxEv - minEv);
  return agxContrast(x);
}
fn agxEotf(v: vec3f) -> vec3f {
  let mi = mat3x3f(1.19687900512017, -0.0528968517574562, -0.0529716355144438,
                   -0.0980208811401368, 1.15190312990417, -0.0980434501171241,
                   -0.0990297440797205, -0.0989611768448433, 1.15107367264116);
  return mi * v;
}
fn agxLook(v: vec3f, sat: f32, power: f32) -> vec3f {
  let l = dot(v, vec3f(0.2126, 0.7152, 0.0722));
  let p = pow(max(v, vec3f(0.0)), vec3f(power));
  return l + sat * (p - l);
}
fn ign(p: vec2f) -> f32 { return fract(52.9829189 * fract(dot(p, vec2f(0.06711056, 0.00583715)))); }

@fragment fn fs(in: VO) -> @location(0) vec4f {
  let dims = vec2f(textureDimensions(hdr));
  let pc = vec2i(in.pos.xy);
  var c = textureLoad(hdr, pc, 0).rgb;
  // Mild sharpen when the picture is drawn below the display size and the browser scales it up.
  if (U.q.w > 0.001) {
    let d = vec2i(dims);
    let blur = (
      textureLoad(hdr, clamp(pc + vec2i(1, 0), vec2i(0), d - 1), 0).rgb +
      textureLoad(hdr, clamp(pc + vec2i(-1, 0), vec2i(0), d - 1), 0).rgb +
      textureLoad(hdr, clamp(pc + vec2i(0, 1), vec2i(0), d - 1), 0).rgb +
      textureLoad(hdr, clamp(pc + vec2i(0, -1), vec2i(0), d - 1), 0).rgb
    ) * 0.25;
    c += (c - blur) * U.q.w;
  }
  // the up-chain accumulates 8 blur levels
  let b = textureSampleLevel(bloom, samp, in.uv, 0.0).rgb * (1.0 / 8.0);
  c = mix(c, b, U.p.y);
  c *= U.p.x;
  // subtle vignette
  let d = (in.uv - 0.5) * vec2f(dims.x / dims.y, 1.0);
  c *= 1.0 - U.p.w * dot(d, d);
  c *= vec3f(1.0 + U.q.z, 1.0, 1.0 - U.q.z);
  // film/sensor-like highlight desaturation: very bright glints and the sun go towards white
  let lum = dot(c, vec3f(0.2126, 0.7152, 0.0722));
  c = mix(c, vec3f(lum), smoothstep(0.7, 6.0, lum) * 0.55);
  var o = agx(c);
  o = agxLook(o, U.q.x, U.q.y);
  o = agxEotf(o);
  // triangular dither against banding in the sky gradients
  let n = ign(in.pos.xy + U.p.z * 5.588238) + ign(in.pos.xy * 1.37 + 17.0 + U.p.z * 3.1) - 1.0;
  o += n / 255.0;
  return vec4f(clamp(o, vec3f(0.0), vec3f(1.0)), 1.0);
}
`;

function sceneById(id) {
  return SCENES.find((s) => s.id === id) || SCENES[0];
}

function hash01(n) {
  let x = (n | 0) ^ 0x9e3779b9;
  x = Math.imul(x ^ (x >>> 16), 0x85ebca6b);
  x = Math.imul(x ^ (x >>> 13), 0xc2b2ae35);
  x ^= x >>> 16;
  return (x >>> 0) / 4294967296;
}

// f: Float32Array of the Frame, written at offsets 100..139. visit varies the terrain
// seed so each pass through the tour is a new stretch of country. mul scales the forest
// (density, height) from the settings panel.
function sceneUniforms(f, scene, visit, mul) {
  const seed = (scene.seed + visit * 101) % 60000;
  const ph = [0, 1, 2, 3].map((i) => hash01(seed * 7 + i) * TAU);
  const k = scene.pathLen.map((l) => TAU / l);
  const mk = TAU / scene.meanderLen;
  f[100] = scene.relief; f[101] = scene.ridge; f[102] = scene.featureScale; f[103] = scene.gully;
  f[104] = scene.valleyWidth; f[105] = scene.floodplain; f[106] = scene.river; f[107] = scene.floor;
  f[108] = scene.path[0]; f[109] = scene.path[1]; f[110] = scene.path[2]; f[111] = scene.meander;
  f[112] = k[0]; f[113] = k[1]; f[114] = k[2]; f[115] = mk;
  f[116] = ph[0]; f[117] = ph[1]; f[118] = ph[2]; f[119] = ph[3];
  f[120] = Math.min(1, scene.density * mul.density); f[121] = scene.spacing;
  f[122] = scene.height * mul.height; f[123] = scene.conifer;
  f[124] = scene.autumn; f[125] = scene.treeline; f[126] = scene.snowline; f[127] = scene.clearings;
  f[128] = scene.rock; f[129] = scene.wetland; f[130] = scene.basin; f[131] = scene.tropical;
  f[132] = scene.mist * mul.mist; f[133] = scene.mistTop; f[134] = 0; f[135] = seed;
  f[136] = scene.water; f[137] = scene.waterSlope; f[138] = scene.tannin; f[139] = scene.coast ? 1 : 0;

  const A = scene.path, M = scene.meander;
  const valleyX = (z) => A[0] * Math.sin(k[0] * z + ph[0]) + A[1] * Math.sin(k[1] * z + ph[1]) + A[2] * Math.sin(k[2] * z + ph[2]);
  const valleyDX = (z) => A[0] * k[0] * Math.cos(k[0] * z + ph[0]) + A[1] * k[1] * Math.cos(k[1] * z + ph[1])
    + A[2] * k[2] * Math.cos(k[2] * z + ph[2]);
  const riverX = (z) => valleyX(z) + M * (Math.sin(mk * z + ph[3]) + 0.35 * Math.sin(2.3 * mk * z + 1.7 + ph[3]));
  const waterLevel = (z) => scene.water - scene.waterSlope * z;
  return { seed, valleyX, valleyDX, riverX, waterLevel };
}

// ---- js/astronomy.js ----
const RAD = Math.PI / 180;
const DAY_MS = 86400000;
const J2000 = Date.UTC(2000, 0, 1, 12);

function norm(angle) {
  angle %= Math.PI * 2;
  return angle < 0 ? angle + Math.PI * 2 : angle;
}

function equatorial(lon, lat = 0) {
  const e = 23.4397 * RAD;
  return {
    ra: Math.atan2(Math.sin(lon) * Math.cos(e) - Math.tan(lat) * Math.sin(e), Math.cos(lon)),
    dec: Math.asin(Math.sin(lat) * Math.cos(e) + Math.cos(lat) * Math.sin(e) * Math.sin(lon)),
  };
}

function sunCoords(days) {
  const mean = (357.5291 + 0.98560028 * days) * RAD;
  const center = (1.9148 * Math.sin(mean) + 0.02 * Math.sin(2 * mean) + 0.0003 * Math.sin(3 * mean)) * RAD;
  return equatorial(mean + center + 102.9372 * RAD + Math.PI);
}

// Main periodic terms of the lunar theory: about 0.3 degree accuracy, enough for the
// phase shape and the moon's place in the sky.
function moonCoords(days) {
  const L = (218.316 + 13.176396 * days) * RAD;
  const Mm = (134.963 + 13.064993 * days) * RAD;
  const Ms = (357.529 + 0.98560028 * days) * RAD;
  const D = (297.850 + 12.190749 * days) * RAD;
  const F = (93.272 + 13.229350 * days) * RAD;
  const lon = L + RAD * (
    6.289 * Math.sin(Mm) +
    1.274 * Math.sin(2 * D - Mm) +
    0.658 * Math.sin(2 * D) +
    0.214 * Math.sin(2 * Mm) -
    0.186 * Math.sin(Ms) -
    0.114 * Math.sin(2 * F)
  );
  const lat = RAD * (
    5.128 * Math.sin(F) +
    0.281 * Math.sin(Mm + F) +
    0.278 * Math.sin(Mm - F) +
    0.173 * Math.sin(2 * D - F)
  );
  return equatorial(lon, lat);
}

function horizontal(coords, days, latitude, longitude) {
  const lat = latitude * RAD;
  const sidereal = (280.16 + 360.9856235 * days + longitude) * RAD;
  const hour = norm(sidereal - coords.ra);
  const altitude = Math.asin(
    Math.sin(lat) * Math.sin(coords.dec) +
    Math.cos(lat) * Math.cos(coords.dec) * Math.cos(hour)
  );
  // Clockwise from geographic north: north=0, east=90.
  const azimuth = norm(Math.atan2(
    Math.sin(hour),
    Math.cos(hour) * Math.sin(lat) - Math.tan(coords.dec) * Math.cos(lat)
  ) + Math.PI);
  return { altitude, azimuth };
}

function direction({ altitude, azimuth }, latitude) {
  const horizontalScale = Math.cos(altitude);
  // Geographic north is -Z. In the northern hemisphere the daily arc is in the south,
  // so turn that arc toward the default view; south of the equator, face north instead.
  const facingEquator = latitude >= 0 ? -1 : 1;
  return [
    facingEquator * Math.sin(azimuth) * horizontalScale,
    Math.sin(altitude),
    facingEquator * -Math.cos(azimuth) * horizontalScale,
  ];
}

function celestialState(date, latitude, longitude) {
  const days = (date.getTime() - J2000) / DAY_MS;
  const sun = horizontal(sunCoords(days), days, latitude, longitude);
  const moon = horizontal(moonCoords(days), days, latitude, longitude);
  const equatorialX = direction(horizontal({ ra: 0, dec: 0 }, days, latitude, longitude), latitude);
  const equatorialY = direction(horizontal({ ra: Math.PI / 2, dec: 0 }, days, latitude, longitude), latitude);
  // Seen from the surface the moon sits about one degree lower than from Earth's centre.
  moon.altitude -= 0.95 * RAD * Math.cos(moon.altitude);
  const sunDirection = direction(sun, latitude);
  const moonDirection = direction(moon, latitude);
  const cosPhase = -(sunDirection[0] * moonDirection[0] + sunDirection[1] * moonDirection[1] + sunDirection[2] * moonDirection[2]);
  return {
    sunDirection,
    moonDirection,
    // The celestial north pole orients the moon's face (its north points toward it).
    poleDirection: direction({ altitude: latitude * RAD, azimuth: 0 }, latitude),
    // J2000 equatorial basis in world space. Together with poleDirection this rotates
    // the fixed star catalogue with local sidereal time.
    equatorialX,
    equatorialY,
    sunAltitude: sun.altitude / RAD,
    sunAzimuth: sun.azimuth / RAD,
    moonAltitude: moon.altitude / RAD,
    moonAzimuth: moon.azimuth / RAD,
    moonIllumination: (1 + cosPhase) / 2,
  };
}

const STAR_MAP_WIDTH = 4096;
const STAR_MAP_HEIGHT = 2048;
const COLOURS = [[155,190,255],[175,205,255],[205,220,255],[245,245,255],[255,244,220],[255,210,165],[255,175,120]];

function createStarMapData() {
  const raw = Uint8Array.from(atob(DATA), (c) => c.charCodeAt(0));
  const pixels = new Uint8Array(STAR_MAP_WIDTH * STAR_MAP_HEIGHT * 4);
  for (let i = 0; i < raw.length; i += 7) {
    const ra = raw[i] | raw[i + 1] << 8;
    const dec = raw[i + 2] | raw[i + 3] << 8;
    const mag = (raw[i + 4] | raw[i + 5] << 8) / 100 - 2;
    const x = Math.min(STAR_MAP_WIDTH - 1, Math.round(ra / 65535 * (STAR_MAP_WIDTH - 1)));
    const y = Math.min(STAR_MAP_HEIGHT - 1, Math.round((1 - dec / 65535) * (STAR_MAP_HEIGHT - 1)));
    const colour = COLOURS[Math.min(6, raw[i + 6])] || COLOURS[3];
    const peak = Math.min(255, Math.round(255 * Math.pow(2.512, -0.34 * (mag - 1))));
    const radius = mag < 0.5 ? 3 : mag < 2 ? 2 : 1;
    // Alpha is this star's scintillation id. Every texel of the splat shares it,
    // and a brighter neighbour keeps its own id where the splats overlap.
    const mark = (Math.imul((i / 7) + 1, 1103515245) >>> 0) % 255 + 1;
    for (let dy = -radius; dy <= radius; dy++) for (let dx = -radius; dx <= radius; dx++) {
      const xx = (x + dx + STAR_MAP_WIDTH) % STAR_MAP_WIDTH, yy = y + dy;
      if (yy < 0 || yy >= STAR_MAP_HEIGHT) continue;
      const falloff = Math.exp(-(dx * dx + dy * dy) / Math.max(0.7, radius * 0.65));
      const o = (yy * STAR_MAP_WIDTH + xx) * 4;
      const weight = (0.25 * colour[0] + 0.5 * colour[1] + 0.25 * colour[2]) * peak / 255 * falloff;
      const prev = 0.25 * pixels[o] + 0.5 * pixels[o + 1] + 0.25 * pixels[o + 2];
      if (weight > 0 && weight >= prev) pixels[o + 3] = mark;
      for (let c = 0; c < 3; c++) pixels[o + c] = Math.min(255, pixels[o + c] + Math.round(colour[c] * peak / 255 * falloff));
    }
  }
  return pixels;
}

const CACHE_KEY = 'web-scenery-place-cache';
const LEGACY_KEYS = [];
const PLACE_TEXT = /^-?[\p{L}\p{N}][\p{L}\p{N}\s.,'’-]*$/u;
const memory = new Map();

function fold(value) {
  return value.normalize('NFD').replace(/\p{M}/gu, '').toLowerCase().replace(/[.'’]/g, '');
}

function digits(length) {
  return (value) => {
    const numeric = value.replace(/\D/g, '');
    return numeric.length === length ? numeric : '';
  };
}

function canadian(value) {
  const compact = value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  return /^[A-Z]\d[A-Z]/.test(compact) ? compact.slice(0, 3) : '';
}

// Zippopotam wants the outward code only: SW1A 1AA -> SW1A, M1 1AE -> M1.
function british(value) {
  const compact = value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (/^[A-Z]{1,2}\d[A-Z\d]?\d[A-Z]{2}$/.test(compact)) return compact.slice(0, -3);
  if (/^[A-Z]{1,2}\d[A-Z\d]?$/.test(compact)) return compact;
  return '';
}

function japanese(value) {
  const numeric = value.replace(/\D/g, '');
  return numeric.length === 7 ? `${numeric.slice(0, 3)}-${numeric.slice(3)}` : '';
}

function brazilian(value) {
  const numeric = value.replace(/\D/g, '');
  return numeric.length === 8 ? `${numeric.slice(0, 5)}-${numeric.slice(5)}` : '';
}

function polish(value) {
  const numeric = value.replace(/\D/g, '');
  return numeric.length === 5 ? `${numeric.slice(0, 2)}-${numeric.slice(2)}` : '';
}

function dutch(value) {
  const match = value.match(/\d{4}/);
  return match ? match[0] : '';
}

function portuguese(value) {
  const numeric = value.replace(/\D/g, '');
  if (numeric.length === 7) return `${numeric.slice(0, 4)}-${numeric.slice(4)}`;
  if (numeric.length === 4) return numeric;
  return '';
}

const POSTAL = {};
function addPostal(names, code, normalize) {
  for (const name of names) POSTAL[fold(name)] = { code, normalize };
}

function storage() {
  try {
    return typeof localStorage === 'undefined' ? null : localStorage;
  } catch {
    return null;
  }
}

function loadJSON(key) {
  const store = storage();
  if (!store) return null;
  try { return JSON.parse(store.getItem(key) || 'null'); } catch { return null; }
}

function barePostal(value) {
  const trimmed = String(value ?? '').trim();
  if (/^\d{5}(?:-\d{4})?$/.test(trimmed)) return false;
  return /^\d[\d\s-]{2,}$/.test(trimmed);
}

function placeHint(value) {
  if (barePostal(value)) return 'Add the country after that postal code, such as 2000, Australia.';
  return 'Enter a city and country, or a 5-digit US ZIP code';
}

function acceptedPlace(value) {
  if (typeof value !== 'string') return '';
  const query = value.trim().replace(/\s+/g, ' ');
  if (query.length < 2 || query.length > 80 || !PLACE_TEXT.test(query)) return '';
  const zip = query.match(/^(\d{5})(?:-\d{4})?$/);
  if (zip) return zip[1];
  if (barePostal(query)) return '';
  return query;
}

function asLocation(entry, query) {
  const latitude = Number(entry?.latitude);
  const longitude = Number(entry?.longitude);
  const stored = entry?.query || entry?.zip || '';
  if (!stored || fold(stored) !== fold(query)) return null;
  if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
  return {
    query,
    latitude,
    longitude,
    name: entry.name || query,
    country: entry.country || (/^\d{5}$/.test(query) ? 'US' : ''),
  };
}

function cachedPlace(query) {
  const key = fold(query);
  if (memory.has(key)) return memory.get(key);
  const entries = loadJSON(CACHE_KEY);
  if (Array.isArray(entries)) {
    for (const entry of entries) {
      const location = asLocation(entry, query);
      if (location) return location;
    }
  }
  for (const legacy of LEGACY_KEYS) {
    const location = asLocation(loadJSON(legacy), query);
    if (location) return location;
  }
  return null;
}

function remember(location) {
  memory.set(fold(location.query), location);
  const store = storage();
  if (!store) return;
  const current = loadJSON(CACHE_KEY);
  const entries = (Array.isArray(current) ? current : [])
    .filter((entry) => fold(entry?.query || '') !== fold(location.query));
  entries.unshift(location);
  try { store.setItem(CACHE_KEY, JSON.stringify(entries.slice(0, 12))); } catch { /* unavailable */ }
}

async function fetchJSON(url) {
  let response;
  try {
    response = await fetch(url);
  } catch {
    throw new Error('Could not reach the location service');
  }
  if (!response.ok) return null;
  try {
    return await response.json();
  } catch {
    throw new Error('Could not reach the location service');
  }
}

function chooseZipPlace(places) {
  if (!places?.length) return null;
  const names = places.map((place) => place['place name'] || '');
  const broader = places.filter((place) => {
    const name = place['place name'] || '';
    return names.some((other) => other.length > name.length && other.startsWith(name));
  });
  if (!broader.length) return places[0];
  broader.sort((a, b) => a['place name'].length - b['place name'].length);
  return broader[0];
}

function fromZip(query, json) {
  const place = chooseZipPlace(json?.places);
  const latitude = Number(place?.latitude);
  const longitude = Number(place?.longitude);
  if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
  const country = String(json['country abbreviation'] || '').toUpperCase();
  const city = place['place name'] || query;
  const region = place['state abbreviation'] || place.state || '';
  const name = country === 'US'
    ? [city, region].filter(Boolean).join(', ')
    : [city, json.country].filter(Boolean).join(', ');
  return { query, latitude, longitude, name, country };
}

async function usZip(query) {
  const json = await fetchJSON(`https://api.zippopotam.us/us/${query}`);
  const location = fromZip(query, json);
  if (!location) {
    throw new Error('That ZIP code was not found. Outside the United States, enter a city and country, such as Lisbon, Portugal.');
  }
  return location;
}

function parseCoordinates(query) {
  const match = query.match(/^(-?\d{1,3}(?:\.\d+)?)\s*,\s*(-?\d{1,3}(?:\.\d+)?)$/);
  if (!match || !query.includes('.')) return null;
  const latitude = Number(match[1]);
  const longitude = Number(match[2]);
  if (Math.abs(latitude) > 90 || Math.abs(longitude) > 180) {
    throw new Error('Latitude must be between -90 and 90, and longitude between -180 and 180.');
  }
  const ns = latitude >= 0 ? 'N' : 'S';
  const ew = longitude >= 0 ? 'E' : 'W';
  return {
    latitude,
    longitude,
    name: `${Math.abs(latitude).toFixed(2)}° ${ns}, ${Math.abs(longitude).toFixed(2)}° ${ew}`,
  };
}

async function postalLookup(query) {
  const comma = query.lastIndexOf(',');
  if (comma === -1) return null;
  const code = query.slice(0, comma).trim();
  const countryName = fold(query.slice(comma + 1).trim());
  if (!/\d/.test(code) || !POSTAL[countryName]) return null;
  const { code: country, normalize } = POSTAL[countryName];
  const postal = normalize(code);
  if (!postal) return null;
  const json = await fetchJSON(`https://api.zippopotam.us/${country}/${encodeURIComponent(postal)}`);
  return fromZip(query, json);
}

function nameScore(resultName, city) {
  if (!city || !resultName) return 0;
  if (resultName === city) return 100;
  if (city.length >= 4 && (resultName.startsWith(city) || city.startsWith(resultName))) return 80;
  return 0;
}

function qualifierScore(result, part) {
  const admin1 = fold(result.admin1 || '');
  const admin2 = fold(result.admin2 || '');
  const country = fold(result.country || '');
  const code = (result.country_code || '').toLowerCase();
  const region = REGION_ABBR[part];
  const countryCode = COUNTRY_ABBR[part];
  const regionHit = (region && admin1 === region) || admin1 === part || admin2 === part;
  const countryHit = country === part || (countryCode && code === countryCode);
  if (regionHit || countryHit) return 50;
  if ((admin1 && (admin1.includes(part) || part.includes(admin1))) || (country && country.includes(part))) return 25;
  return -30;
}

function describeGeocode(result) {
  const name = result.name || '';
  const region = result.admin1 && result.admin1 !== name ? result.admin1 : '';
  const country = result.country && result.country !== name && result.country !== region ? result.country : '';
  if ((result.country_code || '').toUpperCase() === 'US') return [name, region].filter(Boolean).join(', ');
  if (country) return [name, country].join(', ');
  return [name, region].filter(Boolean).join(', ');
}

function notFoundMessage(query) {
  if (!/[\p{Script=Latin}\d]/u.test(query)) {
    return 'Could not find that place. Enter the city name in English, such as Tokyo or Cairo.';
  }
  return 'Could not find that place. Try the city and country, such as Lisbon, Portugal.';
}

async function searchPlaces(name, countryCode) {
  const params = new URLSearchParams({ name, count: '100', language: 'en', format: 'json' });
  if (countryCode) params.set('countryCode', countryCode);
  const json = await fetchJSON(`https://geocoding-api.open-meteo.com/v1/search?${params}`);
  return json?.results || [];
}

function populatedPlace(result) {
  const code = String(result.feature_code || '');
  return !code || code.startsWith('PPL');
}

function nameMatches(result, city) {
  const name = fold(result.name || '');
  const query = fold(city);
  return Boolean(name && query && (name === query || name.startsWith(query)));
}

function rankPlaces(results, query) {
  const parts = query.split(',').map((part) => fold(part.trim())).filter(Boolean);
  const [city, ...rest] = parts;
  let best = null;
  let bestScore = 0;
  for (const result of results) {
    if (!Number.isFinite(result.latitude) || !Number.isFinite(result.longitude)) continue;
    const matched = nameScore(fold(result.name || ''), city);
    if (!matched) continue;
    let score = matched + Math.log10((result.population || 0) + 1);
    if (rest.length) {
      const extra = rest.reduce((sum, part) => sum + qualifierScore(result, part), 0);
      if (extra < 20) continue;
      score += extra;
    }
    if (score > bestScore) {
      bestScore = score;
      best = result;
    }
  }
  return best;
}

async function geocode(query) {
  const parts = query.split(',').map((part) => part.trim()).filter(Boolean);
  let best = rankPlaces(await searchPlaces(query), query);
  if (!best && parts.length > 1) {
    const countryCode = parts.slice(1).map((part) => COUNTRY_ABBR[fold(part)]).find(Boolean);
    // "DE" is both Germany and Delaware. A region match such as Dover, DE is kept above.
    // This second search covers Berlin, DE, where the first pass only saw Delaware.
    if (countryCode) best = rankPlaces(await searchPlaces(parts[0], countryCode), query);
  }
  if (!best) throw new Error(notFoundMessage(query));
  return {
    query,
    latitude: best.latitude,
    longitude: best.longitude,
    name: describeGeocode(best) || query,
    country: String(best.country_code || '').toUpperCase(),
  };
}

function choiceLabel(result) {
  const parts = [result.name, result.admin1, result.country];
  return parts.filter((part, index) => part && parts.indexOf(part) === index).join(', ');
}

function choiceFromResult(result) {
  const name = describeGeocode(result) || result.name || '';
  return {
    value: name,
    name,
    label: choiceLabel(result) || name,
    latitude: result.latitude,
    longitude: result.longitude,
    country: String(result.country_code || '').toUpperCase(),
  };
}

function rememberChoice(choice) {
  const query = acceptedPlace(choice?.value);
  const latitude = Number(choice?.latitude);
  const longitude = Number(choice?.longitude);
  if (!query || !Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
  remember({
    query,
    latitude,
    longitude,
    name: choice.name || query,
    country: choice.country || '',
  });
}

async function suggestPlaces(value) {
  const query = String(value || '').trim().replace(/\s+/g, ' ');
  if (query.length < 2) return [];
  const choices = [];
  const seen = new Set();
  const add = (choice) => {
    if (!choice?.value || !Number.isFinite(choice.latitude) || !Number.isFinite(choice.longitude)) return;
    const id = `${choice.latitude.toFixed(2)},${choice.longitude.toFixed(2)}`;
    if (seen.has(id)) return;
    seen.add(id);
    choices.push(choice);
  };
  if (/^\d{5}$/.test(query)) {
    try {
      const place = await usZip(query);
      add({ value: place.name, name: place.name, label: `${place.name}, United States`, latitude: place.latitude, longitude: place.longitude, country: place.country });
    } catch (error) {
      if (error.message === 'Could not reach the location service') throw error;
    }
  }
  try {
    const coordinates = parseCoordinates(query);
    if (coordinates) add({ value: query, name: coordinates.name, label: coordinates.name, country: '', ...coordinates });
  } catch (error) {
    if (/Latitude must be/.test(error.message)) throw error;
  }
  const postal = await postalLookup(query);
  if (postal) add({ value: postal.name, name: postal.name, label: postal.name, latitude: postal.latitude, longitude: postal.longitude, country: postal.country });
  const parts = query.split(',').map((part) => part.trim()).filter(Boolean);
  const countryCode = parts.slice(1).map((part) => COUNTRY_ABBR[fold(part)]).find(Boolean);
  const batches = [await searchPlaces(query)];
  if (countryCode) batches.push(await searchPlaces(parts[0], countryCode));
  const matches = batches.flat().filter((result) => nameMatches(result, parts[0] || query));
  const places = matches.filter(populatedPlace);
  for (const result of (places.length ? places : matches)) add(choiceFromResult(result));
  choices.sort((a, b) => a.label.localeCompare(b.label, undefined, { numeric: true, sensitivity: 'base' }));
  return choices;
}

async function lookup(query) {
  if (/^\d{5}$/.test(query)) return usZip(query);
  const coordinates = parseCoordinates(query);
  if (coordinates) return { query, country: '', ...coordinates };
  const postal = await postalLookup(query);
  if (postal) return postal;
  return geocode(query);
}

async function resolvePlace(value) {
  const query = acceptedPlace(value);
  if (!query) throw new Error(placeHint(value));
  const cached = cachedPlace(query);
  if (cached) {
    memory.set(fold(query), cached);
    return cached;
  }
  const location = await lookup(query);
  remember(location);
  return location;
}

const ICONS = {

  humidity: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2.5S5.8 10 5.8 15a6.2 6.2 0 0 0 12.4 0C18.2 10 12 2.5 12 2.5Z"/><path d="M9 16.2a3.2 3.2 0 0 0 3 2.1"/></svg>',
  wind: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h11.5a2.5 2.5 0 1 0-2.3-3.5M3 12h16a2.5 2.5 0 1 1-2.3 3.5M3 16h7"/></svg>',
  alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 2.5 20h19L12 3Z"/><path d="M12 9v5m0 3v.1"/></svg>',
};

function condition(code) {
  if (code === 0) return ['Clear', 'clear'];
  if (code <= 2) return ['Partly cloudy', 'partly'];
  if (code === 3) return ['Overcast', 'cloud'];
  if (code === 45 || code === 48) return ['Fog', 'fog'];
  if (code >= 51 && code <= 57) return ['Drizzle', 'rain'];
  if (code >= 61 && code <= 67) return ['Rain', 'rain'];
  if (code >= 71 && code <= 77) return ['Snow', 'snow'];
  if (code >= 80 && code <= 82) return ['Rain showers', 'rain'];
  if (code >= 85 && code <= 86) return ['Snow showers', 'snow'];
  if (code >= 95) return ['Thunderstorms', 'storm'];
  return ['Current conditions', 'cloud'];
}

// Open-Meteo uses WMO weather codes. Each wet code maps to one rain, storm, or snow setup.
function rainLook(intensity, ripples, splashes, lightning = 0, style = 'rain') {
  return { rain: true, intensity, style, lightning, ripples, splashes };
}
function dryRain() {
  return { rain: false, intensity: 0, style: 'rain', lightning: 0, ripples: 0, splashes: 0 };
}
function snowLook(intensity) {
  return { rain: true, intensity, style: 'snow', lightning: 0, ripples: 0, splashes: 0 };
}
const RAIN_BY_CODE = {
  51: rainLook(0.10, 0.45, 0.22), // light drizzle
  53: rainLook(0.16, 0.62, 0.34), // moderate drizzle
  55: rainLook(0.24, 0.8, 0.48), // dense drizzle
  56: rainLook(0.12, 0.5, 0.26), // light freezing drizzle
  57: rainLook(0.28, 0.85, 0.52), // dense freezing drizzle
  61: rainLook(0.34, 1.0, 0.85), // slight rain
  63: rainLook(0.52, 1.25, 1.1), // moderate rain
  65: rainLook(0.74, 1.55, 1.45, 0.08), // heavy rain
  66: rainLook(0.36, 1.0, 0.85), // light freezing rain
  67: rainLook(0.8, 1.6, 1.5, 0.12), // heavy freezing rain
  80: rainLook(0.36, 1.15, 1.05), // slight rain showers
  81: rainLook(0.58, 1.4, 1.3, 0.1), // moderate rain showers
  82: rainLook(0.9, 1.75, 1.7, 0.28), // violent rain showers
  71: snowLook(0.22), // slight snow
  73: snowLook(0.48), // moderate snow
  75: snowLook(0.78), // heavy snow
  77: snowLook(0.16), // snow grains
  85: snowLook(0.34), // slight snow showers
  86: snowLook(0.72), // heavy snow showers
  95: rainLook(0.7, 1.5, 1.45, 0.65, 'thunderstorm'),
  96: rainLook(0.84, 1.7, 1.65, 0.82, 'thunderstorm'), // thunderstorm, slight hail
  99: rainLook(0.97, 1.9, 1.85, 0.95, 'thunderstorm'), // thunderstorm, heavy hail
};
const DRY_WEATHER_CODES = new Set([0, 1, 2, 3, 45, 48]);

function rainLookFromAmount(amount, metric) {
  const mm = metric ? amount : amount * 25.4;
  if (mm < 0.3) return RAIN_BY_CODE[51];
  if (mm < 2.5) return RAIN_BY_CODE[61];
  if (mm < 7.6) return RAIN_BY_CODE[63];
  return RAIN_BY_CODE[65];
}

function rainPresetForObservation(obs) {
  if (!obs) return null;
  const code = Number(obs.code);
  if (RAIN_BY_CODE[code]) return { ...RAIN_BY_CODE[code] };
  if (DRY_WEATHER_CODES.has(code)) return dryRain();
  const amount = Number(obs.precipitation);
  if (Number.isFinite(amount) && amount > 0) return { ...rainLookFromAmount(amount, obs.metric !== false) };
  return dryRain();
}

function weatherIcon(kind, day) {
  const sun = '<circle cx="31" cy="28" r="11" fill="currentColor"/><g stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M31 8v-5m0 50v-5M11 28H6m50 0h-5M17 14l-4-4m36 36-4-4m0-28 4-4M13 46l4-4"/></g>';
  const moon = '<path d="M40 8a21 21 0 1 0 9 37A18 18 0 0 1 40 8Z" fill="currentColor"/>';
  const cloud = '<path d="M17 49h30a10 10 0 0 0 1-20 16 16 0 0 0-30-2A11 11 0 0 0 17 49Z" fill="#e9f3fa" stroke="#adc1cf" stroke-width="2"/>';
  const base = day ? sun : moon;
  const wrap = (body) => `<svg viewBox="0 0 64 64" aria-hidden="true">${body}</svg>`;
  if (kind === 'clear') return wrap(base);
  if (kind === 'partly') return wrap(base + cloud);
  if (kind === 'cloud') return wrap('<path d="M14 47h36a12 12 0 0 0 0-24 19 19 0 0 0-35-1A13 13 0 0 0 14 47Z" fill="#e9f3fa" stroke="#adc1cf" stroke-width="2"/>');
  if (kind === 'fog') return wrap(cloud + '<g stroke="#d9e8ef" stroke-width="3" stroke-linecap="round"><path d="M10 53h42M16 59h34"/></g>');
  if (kind === 'snow') return wrap(cloud + '<g fill="#d8f3ff"><circle cx="23" cy="56" r="2"/><circle cx="35" cy="58" r="2"/><circle cx="47" cy="55" r="2"/></g>');
  if (kind === 'storm') return wrap(cloud + '<path d="m35 45-8 12h7l-3 7 13-15h-8l4-4Z" fill="#ffd24f"/>');
  return wrap(cloud + '<g stroke="#7dd7ff" stroke-width="3" stroke-linecap="round"><path d="m22 53-3 6m16-6-3 6m16-6-3 6"/></g>');
}

function detail(icon, text) {
  return `<span class="weather-detail">${ICONS[icon]}<span>${text}</span></span>`;
}

function compass(degrees) {
  const points = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  return points[Math.round((Number(degrees) || 0) / 45) % 8];
}

function rounded(value) {
  const number = Number(value);
  return Number.isFinite(number) ? Math.round(number) : null;
}

function tempBlock(config, current, unit, high, low) {
  const currentHTML = config.weatherTemp
    ? `<div class="weather-temp">${Math.round(current.temperature_2m)}${unit}</div>`
    : '';
  const rangeHTML = high == null || low == null ? '' : `<div class="weather-range" aria-label="Today high ${high} degrees, low ${low} degrees"><span>H ${high}°</span><span>L ${low}°</span></div>`;
  return currentHTML || rangeHTML ? `<div class="weather-temp-block">${currentHTML}${rangeHTML}</div>` : '';
}

function todayTemperatures(daily, currentTime) {
  const times = daily?.time || [];
  if (!times.length) return null;
  const today = String(currentTime || '').slice(0, 10);
  const found = times.indexOf(today);
  const index = found >= 0 ? found : 0;
  return {
    high: daily.temperature_2m_max?.[index],
    low: daily.temperature_2m_min?.[index],
  };
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, (character) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  })[character]);
}

function highestAlert(features) {
  const rank = { Extreme: 4, Severe: 3, Moderate: 2, Minor: 1, Unknown: 0 };
  return [...features].sort((a, b) => (rank[b.properties?.severity] || 0) - (rank[a.properties?.severity] || 0))[0];
}

function alertStatement(props) {
  const clean = (value) => String(value || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  const body = [clean(props.description), clean(props.instruction)].filter(Boolean).join('\n\n');
  return body || props.headline || props.areaDesc || 'See local authorities for details';
}

function playAlertScroll(root) {
  const viewport = root.querySelector('.weather-alert-scroll');
  const track = viewport?.querySelector('.weather-alert-track');
  const text = track?.querySelector('p');
  if (!text?.isConnected || track.querySelector('[aria-hidden]')) return;
  if (text.scrollHeight - viewport.clientHeight < 8) return;
  const clone = text.cloneNode(true);
  clone.setAttribute('aria-hidden', 'true');
  text.after(clone);
  // One line per second. The second copy makes the restart line up with the first.
  track.style.animationDuration = `${Math.min(180, Math.max(12, text.offsetHeight / 14))}s`;
  viewport.classList.add('scrolling');
}

function createWeatherWidget(root, status, onObservation) {
  let timer = 0;
  let request = 0;
  let controller = null;
  let lastConfig = null;
  let fetchDelay = 0;
  let data = null;

  function render(config) {
    root.hidden = !config.weather;
    root.dataset.position = config.weatherPosition;
    if (!config.weather || !data) return;
    if (data.error) {
      root.innerHTML = `<div class="weather-card weather-error">${escapeHTML(data.error)}</div>`;
      return;
    }
    const { current, hourly, daily, location, alerts } = data;
    const [label, icon] = condition(current.weather_code);
    const unit = config.weatherUnit === 'celsius' ? '°C' : '°F';
    const speedUnit = config.weatherUnit === 'celsius' ? 'km/h' : 'mph';
    const high = rounded(daily?.high);
    const low = rounded(daily?.low);
    const details = [];
    if (config.weatherFeels) details.push(detail('temp', `Feels ${Math.round(current.apparent_temperature)}${unit}`));
    if (config.weatherPrecip) {
      const chance = hourly.chances[0] ?? 0;
      details.push(detail('drop', `${chance}% · ${current.precipitation.toFixed(config.weatherUnit === 'celsius' ? 1 : 2)} ${config.weatherUnit === 'celsius' ? 'mm' : 'in'}`));
    }
    if (config.weatherHumidity) details.push(detail('humidity', `${current.relative_humidity_2m}%`));
    if (config.weatherWind) details.push(detail('wind', `${compass(current.wind_direction_10m)} ${Math.round(current.wind_speed_10m)} ${speedUnit}`));

    let alertHTML = '';
    if (config.weatherAlerts && alerts.length) {
      const alert = highestAlert(alerts);
      const props = alert.properties || {};
      const extra = alerts.length > 1 ? ` · ${alerts.length} active alerts` : '';
      const severity = ['Extreme', 'Severe', 'Moderate', 'Minor'].includes(props.severity) ? props.severity : 'Unknown';
      alertHTML = `<div class="weather-alert" data-severity="${severity}">
        <span class="weather-alert-icon">${ICONS.alert}</span><div><strong>${escapeHTML(props.event || 'Weather alert')}${extra}</strong>
        <div class="weather-alert-scroll"><div class="weather-alert-track"><p>${escapeHTML(alertStatement(props))}</p></div></div></div></div>`;
    }
    let forecastHTML = '';
    if (config.weatherForecast && hourly.times.length) {
      const hours = hourly.times.map((time, i) => {
        const text = new Intl.DateTimeFormat([], { hour: 'numeric' }).format(new Date(time));
        const temperature = rounded(hourly.temperatures?.[i]);
        const tempLine = temperature == null ? '' : `<strong>${temperature}°</strong>`;
        return `<div class="weather-hour"><time>${text}</time>${tempLine}<span class="weather-hour-rain">${hourly.chances[i] ?? 0}% rain</span></div>`;
      }).join('');
      forecastHTML = `<div class="weather-forecast">${hours}</div>`;
    }
    const updated = new Date(data.updatedAt);
    const updatedText = new Intl.DateTimeFormat([], {
      hour: 'numeric',
      minute: '2-digit',
      hour12: !config.clock24h,
    }).format(updated);
    root.innerHTML = `${alertHTML}<div class="weather-card"><div class="weather-main">
      <div class="weather-icon">${weatherIcon(icon, current.is_day)}</div>
      <div><button type="button" class="weather-place" title="${escapeHTML(location.name || location.query)}" aria-label="Change weather location, ${escapeHTML(location.name || location.query)}">${escapeHTML(location.name || location.query)}</button><div class="weather-condition">${label}</div></div>
      ${tempBlock(config, current, unit, high, low)}
      </div>${details.length ? `<div class="weather-details">${details.join('')}</div>` : ''}${forecastHTML}
      <time class="weather-updated" datetime="${updated.toISOString()}">Updated ${updatedText}</time></div>`;
    if (root.querySelector('.weather-alert-scroll')) requestAnimationFrame(() => playAlertScroll(root));
  }

  async function refresh(config) {
    if (!config.weather && !config.rainFollow) return;
    const token = ++request;
    controller?.abort();
    controller = new AbortController();
    try {
      status('Updating weather…');
      const location = await resolvePlace(config.weatherZip);
      const metric = config.weatherUnit === 'celsius';
      const params = new URLSearchParams({
        latitude: location.latitude,
        longitude: location.longitude,
        current: 'temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day',
        hourly: 'precipitation_probability,temperature_2m',
        daily: 'temperature_2m_max,temperature_2m_min',
        temperature_unit: metric ? 'celsius' : 'fahrenheit',
        wind_speed_unit: metric ? 'kmh' : 'mph',
        precipitation_unit: metric ? 'mm' : 'inch',
        timezone: 'auto',
        forecast_days: '2',
      });
      const weatherURL = `https://api.open-meteo.com/v1/forecast?${params}`;
      const alertURL = `https://api.weather.gov/alerts/active?point=${location.latitude},${location.longitude}`;
      const alerts = location.country === 'US'
        ? fetch(alertURL, { signal: controller.signal, headers: { Accept: 'application/geo+json' } }).then((r) => r.ok ? r.json() : { features: [] })
        : Promise.resolve({ features: [] });
      const [weatherResult, alertResult] = await Promise.allSettled([
        fetch(weatherURL, { signal: controller.signal }).then((r) => {
          if (!r.ok) throw new Error('Weather service unavailable');
          return r.json();
        }),
        alerts,
      ]);
      if (token !== request) return;
      if (weatherResult.status !== 'fulfilled') throw weatherResult.reason;
      const weather = weatherResult.value;
      const now = Date.now();
      const future = (weather.hourly?.time || []).map((time, i) => ({
        time,
        chance: weather.hourly.precipitation_probability?.[i],
        temperature: weather.hourly.temperature_2m?.[i],
      })).filter((item) => new Date(item.time).getTime() >= now - 1800000).slice(0, 3);
      data = {
        current: weather.current,
        location,
        alerts: alertResult.status === 'fulfilled' ? alertResult.value.features || [] : [],
        hourly: {
          times: future.map((item) => item.time),
          chances: future.map((item) => item.chance),
          temperatures: future.map((item) => item.temperature),
        },
        daily: todayTemperatures(weather.daily, weather.current?.time),
        updatedAt: now,
      };
      onObservation?.(liveObservation());
      status(`${location.name || location.query} weather updated`);
      render(config);
    } catch (error) {
      if (error.name === 'AbortError' || token !== request) return;
      data = { error: error.message || 'Weather unavailable' };
      status(data.error);
      render(config);
    }
  }

  function liveObservation() {
    if (!data?.current || data.error) return null;
    return {
      code: data.current.weather_code,
      precipitation: data.current.precipitation,
      chance: data.hourly?.chances?.[0] ?? 0,
      metric: lastConfig?.weatherUnit === 'celsius',
    };
  }

  function update(config, fetchNow = false) {
    lastConfig = { ...config };
    render(lastConfig);
    clearInterval(timer);
    clearTimeout(fetchDelay);
    if (config.weather || config.rainFollow) {
      timer = setInterval(() => refresh(lastConfig), Math.max(1, config.weatherRefresh) * 60000);
      if (fetchNow || !data) fetchDelay = setTimeout(() => refresh(lastConfig), 50);
    }
  }

  return { update, refresh: () => lastConfig && refresh(lastConfig), getObservation: liveObservation };
}

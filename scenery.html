<script type="module">
// ---- js/wgsl/common.js ----
// Shared constants and WGSL snippets.
const SKY_W = 256;      // sky-view LUT size
const SKY_H = 144;
const AP_RES = 32;      // aerial-perspective froxel volume (x, y, depth slices)
const AP_MAX_KM = 96;   // distance covered by the last depth slice
const CLIP_RES = 512;   // terrain clipmap texels per side and level
const CLIP_LEVELS = 9;  // texel doubles per level: 2 m ... 512 m
const CLIP_TEXEL0 = 2;  // finest clipmap texel (m)
const PROBE_N = 32;     // terrain height probes for the flight controller
// Trees are real instanced crowns out to TREE_RANGE. The near list uses the full cone,
// the far list a cheaper one. Past the range the ground carries the stand colour.
const TREE_RANGE = 6000;
const TREE_NEAR_DIST = 1800;
const TREE_MAX = 900000;
const TREE_NEAR_MAX = 160000;

// Per-frame uniform block shared by every render / sky / terrain shader.
// Layout must match the Float32Array offsets in main.js (writeFrame).
const FRAME_WGSL = /* wgsl */ `
struct Frame {
  viewProj: mat4x4f,   // camera-relative view-projection (reverse-Z, infinite)
  camPos:   vec4f,     // xyz metres, w = time (s)
  camRight: vec4f,     // xyz * tan(fovX/2)
  camUp:    vec4f,     // xyz * tan(fovY/2)
  camFwd:   vec4f,     // xyz
  sunDir:   vec4f,     // xyz towards sun, w = solar illuminance scale
  screen:   vec4f,     // w, h, 1/w, 1/h
  lodP:     vec4f,     // CDLOD base range, grid quads per node, -, -
  post:     vec4f,     // exposure, bloom strength, frame index, debug view
  atmo:     vec4f,     // haze (mie multiplier), camera altitude km, high cloud cover, -
  cloudP:   vec4f,     // low altitude km, coverage, edge softness, cloud shadow strength
  moonDir:  vec4f,     // xyz towards moon, w = moon brightness
  moonLight: vec4f,    // xyz from moon towards sun, w = moon angular-radius multiplier
  nightP:   vec4f,     // star density, brightness, twinkle, night-sky brightness
  moonUp:   vec4f,     // xyz towards the celestial north pole (orients the lunar face)
  cloudWind: vec4f,    // low scroll fraction xz (km, 0-1), -, shape-evolution generations
  cloudHigh: vec4f,    // high scroll fraction xz (km, 0-1), -, horizontal scale
  cloudShape: vec4f,   // low scale, high altitude km, edge softness, -
  cloudLight: vec4f,   // low/high optical density, silver lining, ambient light
  starX: vec4f,        // J2000 equatorial x axis in world space
  starY: vec4f,        // J2000 equatorial y axis in world space
  cloudKm: vec4i,      // integer km of the scroll: low x, low z, high x, high z
  relief:  vec4f,      // relief (m), ridge sharpness, feature scale (m), gully strength
  valley:  vec4f,      // valley half-width (m), floodplain half-width (m), river half-width (m), floor height above water (m)
  pathA:   vec4f,      // valley path amplitudes (m) x3, river meander amplitude (m)
  pathK:   vec4f,      // valley path wavenumbers (rad/m) x3, meander wavenumber
  pathPh:  vec4f,      // phases
  forest:  vec4f,      // tree density, tree spacing (m), tree height (m), conifer share
  forest2: vec4f,      // autumn colour, treeline (m above water), snowline (m above water), clearings
  biome:   vec4f,      // rock exposure, wetland, basin depth (lakes), broadleaf style (0 temperate, 1 tropical)
  mist:    vec4f,      // valley mist density, mist top (m above water), -, terrain seed
  water:   vec4f,      // water level at z = 0 (m), downstream slope, water tint (0 clear, 1 tannin), coast (0 inland, 1 shoreline)
};
`;

const ATMO_CORE_WGSL = /* wgsl */ `
const PI: f32 = 3.14159265358979;
const RG: f32 = 6360.0;
const RT: f32 = 6460.0;
const RAY_S: vec3f = vec3f(5.802e-3, 13.558e-3, 33.1e-3);
const MIE_S: f32 = 3.996e-3;
const MIE_E: f32 = 4.40e-3;
const OZO_A: vec3f = vec3f(0.650e-3, 1.881e-3, 0.085e-3);
const SUN_ANG_R: f32 = 0.004675;
const TRANS_W: f32 = 256.0;
const TRANS_H: f32 = 64.0;
const MS_SIZE: f32 = 32.0;

struct Medium { ext: vec3f, rayS: vec3f, mieS: f32 };

fn medium(h: f32, haze: f32) -> Medium {
  let hh = max(h, 0.0);
  let dR = exp(-hh / 8.0);
  // aerosols: a continental boundary layer about 1.2 km deep
  let dM = exp(-hh / 1.2);
  let dO = max(0.0, 1.0 - abs(hh - 25.0) / 15.0);
  var m: Medium;
  m.rayS = RAY_S * dR;
  m.mieS = MIE_S * dM * haze;
  m.ext = m.rayS + vec3f(MIE_E * dM * haze) + OZO_A * dO;
  return m;
}

fn raySphere(ro: vec3f, rd: vec3f, R: f32) -> vec2f {
  let l = length(ro);
  let b = dot(ro, rd);
  let c = (l - R) * (l + R);
  let d = b * b - c;
  if (d < 0.0) { return vec2f(-1.0, -1.0); }
  let s = sqrt(d);
  return vec2f(-b - s, -b + s);
}

fn rhoOf(r: f32) -> f32 { return sqrt(max(0.0, (r - RG) * (r + RG))); }

fn transRMuToUV(r: f32, mu: f32) -> vec2f {
  let H = sqrt(RT * RT - RG * RG);
  let rho = rhoOf(r);
  let disc = r * r * (mu * mu - 1.0) + RT * RT;
  let d = max(0.0, -r * mu + sqrt(max(disc, 0.0)));
  let dMin = RT - r;
  let dMax = rho + H;
  let x = (d - dMin) / (dMax - dMin);
  let y = rho / H;
  return vec2f(x, y);
}

fn transUVToRMu(uv: vec2f) -> vec2f {
  let H = sqrt(RT * RT - RG * RG);
  let rho = H * uv.y;
  let r = sqrt(rho * rho + RG * RG);
  let dMin = RT - r;
  let dMax = rho + H;
  let d = dMin + uv.x * (dMax - dMin);
  var mu = 1.0;
  if (d > 0.0) { mu = (H * H - rho * rho - d * d) / (2.0 * r * d); }
  return vec2f(r, clamp(mu, -1.0, 1.0));
}

fn fromUnitToSubUvs(u: f32, res: f32) -> f32 { return (u + 0.5 / res) * (res / (res + 1.0)); }
fn fromSubUvsToUnit(u: f32, res: f32) -> f32 { return (u - 0.5 / res) * (res / (res - 1.0)); }

fn phaseRayleigh(c: f32) -> f32 { return 3.0 / (16.0 * PI) * (1.0 + c * c); }
fn phaseMie(c: f32, g: f32) -> f32 {
  let g2 = g * g;
  return 3.0 / (8.0 * PI) * ((1.0 - g2) * (1.0 + c * c)) / ((2.0 + g2) * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}
fn phaseHG(c: f32, g: f32) -> f32 {
  let g2 = g * g;
  return (1.0 - g2) / (4.0 * PI * pow(max(1.0 + g2 - 2.0 * g * c, 1e-4), 1.5));
}

// true when the sun is below the geometric horizon of a point at radius r
fn sunBelowHorizon(r: f32, mu: f32) -> bool {
  return mu < -rhoOf(r) / r;
}
`;

// Hashing helpers used by the procedural generators.
const NOISE_WGSL = /* wgsl */ `
fn pcgHash(v: u32) -> u32 {
  let s = v * 747796405u + 2891336453u;
  let w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u;
  return (w >> 22u) ^ w;
}
fn hashGrad(i: vec2i) -> vec2f {
  let h = pcgHash(u32(i.x) * 1664525u + pcgHash(u32(i.y) + 1013904223u));
  let a = f32(h) * (6.28318530718 / 4294967296.0);
  return vec2f(cos(a), sin(a));
}
fn gnoise(p: vec2f) -> f32 {
  let i = vec2i(floor(p));
  let f = p - floor(p);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(hashGrad(i), f);
  let b = dot(hashGrad(i + vec2i(1, 0)), f - vec2f(1.0, 0.0));
  let c = dot(hashGrad(i + vec2i(0, 1)), f - vec2f(0.0, 1.0));
  let d = dot(hashGrad(i + vec2i(1, 1)), f - vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
`;

// ---- js/wgsl/sky.js ----
// Physically based atmosphere (Hillaire 2020 style LUTs), aerial-perspective volume,
// procedural cloud deck and the cloud shadows it casts on the ground.



const ATMO_UNIFORM = /* wgsl */ `
struct AtmoP { haze: vec4f };   // x = mie multiplier
@group(0) @binding(0) var<uniform> A: AtmoP;
`;

const TRANS_LUT = ATMO_CORE_WGSL + ATMO_UNIFORM + /* wgsl */ `
@group(0) @binding(1) var dst: texture_storage_2d<rgba16float, write>;
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (f32(id.x) >= TRANS_W || f32(id.y) >= TRANS_H) { return; }
  let uv = (vec2f(id.xy) + 0.5) / vec2f(TRANS_W, TRANS_H);
  let rm = transUVToRMu(uv);
  let ro = vec3f(0.0, rm.x, 0.0);
  let rd = vec3f(sqrt(max(0.0, 1.0 - rm.y * rm.y)), rm.y, 0.0);
  let tMax = raySphere(ro, rd, RT).y;
  var od = vec3f(0.0);
  let STEPS = 64u;
  let dt = tMax / f32(STEPS);
  for (var i = 0u; i < STEPS; i++) {
    let p = ro + rd * ((f32(i) + 0.5) * dt);
    od += medium(length(p) - RG, A.haze.x).ext * dt;
  }
  textureStore(dst, id.xy, vec4f(exp(-od), 1.0));
}
`;

const MS_LUT = ATMO_CORE_WGSL + ATMO_UNIFORM + /* wgsl */ `
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var sampC: sampler;
@group(0) @binding(3) var dst: texture_storage_2d<rgba16float, write>;

fn sampleTrans(r: f32, mu: f32) -> vec3f {
  return textureSampleLevel(transLUT, sampC, transRMuToUV(r, mu), 0.0).rgb;
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (f32(id.x) >= MS_SIZE || f32(id.y) >= MS_SIZE) { return; }
  var uv = (vec2f(id.xy) + 0.5) / MS_SIZE;
  uv = vec2f(fromSubUvsToUnit(uv.x, MS_SIZE), fromSubUvsToUnit(uv.y, MS_SIZE));
  let cosSun = uv.x * 2.0 - 1.0;
  let h = max(uv.y * (RT - RG), 0.01);
  let r = RG + h;
  let ro = vec3f(0.0, r, 0.0);
  let sun = vec3f(sqrt(max(0.0, 1.0 - cosSun * cosSun)), cosSun, 0.0);
  var Lsum = vec3f(0.0);
  var Fsum = vec3f(0.0);
  let SQ = 8u;
  let STEPS = 20u;
  for (var a = 0u; a < SQ; a++) {
    for (var b = 0u; b < SQ; b++) {
      let th = acos(1.0 - 2.0 * (f32(b) + 0.5) / f32(SQ));
      let ph = 2.0 * PI * (f32(a) + 0.5) / f32(SQ);
      let rd = vec3f(sin(th) * cos(ph), cos(th), sin(th) * sin(ph));
      let tTop = raySphere(ro, rd, RT);
      let tGr = raySphere(ro, rd, RG);
      var tMax = tTop.y;
      let hitG = tGr.x > 0.0;
      if (hitG) { tMax = tGr.x; }
      let dt = tMax / f32(STEPS);
      var T = vec3f(1.0);
      var L = vec3f(0.0);
      var Fms = vec3f(0.0);
      for (var s = 0u; s < STEPS; s++) {
        let p = ro + rd * ((f32(s) + 0.5) * dt);
        let pr = length(p);
        let m = medium(pr - RG, A.haze.x);
        let scat = m.rayS + vec3f(m.mieS);
        let Ts = exp(-m.ext * dt);
        let smu = dot(p, sun) / pr;
        var sunT = sampleTrans(pr, smu);
        if (sunBelowHorizon(pr, smu)) { sunT = vec3f(0.0); }
        let ext = max(m.ext, vec3f(1e-9));
        let S = scat * sunT / (4.0 * PI);
        L += T * (S - S * Ts) / ext;
        Fms += T * (scat - scat * Ts) / ext;
        T *= Ts;
      }
      if (hitG) {
        let pg = ro + rd * tMax;
        let ng = normalize(pg);
        let smu = dot(ng, sun);
        L += T * sampleTrans(RG, smu) * max(smu, 0.0) * 0.06 / PI;
      }
      Lsum += L;
      Fsum += Fms;
    }
  }
  let invN = 1.0 / f32(SQ * SQ);
  let L2 = Lsum * invN;
  let fms = Fsum * invN;
  textureStore(dst, id.xy, vec4f(L2 / (1.0 - fms), 1.0));
}
`;

// Sky-view LUT, recomputed every frame (sun / camera altitude may change).
const SKYVIEW_LUT = FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var msLUT: texture_2d<f32>;
@group(0) @binding(3) var sampC: sampler;
@group(0) @binding(4) var dst: texture_storage_2d<rgba16float, write>;
const SKY_W: f32 = ${SKY_W}.0;
const SKY_H: f32 = ${SKY_H}.0;

fn sampleTrans(r: f32, mu: f32) -> vec3f {
  return textureSampleLevel(transLUT, sampC, transRMuToUV(r, mu), 0.0).rgb;
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (f32(id.x) >= SKY_W || f32(id.y) >= SKY_H) { return; }
  var uv = (vec2f(id.xy) + 0.5) / vec2f(SKY_W, SKY_H);
  uv = vec2f(fromSubUvsToUnit(uv.x, SKY_W), fromSubUvsToUnit(uv.y, SKY_H));
  let haze = F.atmo.x;
  let r = RG + F.atmo.y;
  let vHorizon = rhoOf(r);
  let cosBeta = vHorizon / r;
  let beta = acos(clamp(cosBeta, -1.0, 1.0));
  let zha = PI - beta;
  var vza: f32;
  if (uv.y < 0.5) {
    var coord = 2.0 * uv.y;
    coord = 1.0 - coord;
    coord *= coord;
    coord = 1.0 - coord;
    vza = zha * coord;
  } else {
    var coord = uv.y * 2.0 - 1.0;
    coord *= coord;
    vza = zha + beta * coord;
  }
  let vzc = cos(vza);
  let vzs = sin(vza);
  let cx = uv.x * uv.x;
  let lvc = -(cx * 2.0 - 1.0);
  let lvs = sqrt(max(0.0, 1.0 - lvc * lvc));
  let rd = vec3f(vzs * lvc, vzc, vzs * lvs);
  let smu = F.sunDir.y;
  let sun = vec3f(sqrt(max(0.0, 1.0 - smu * smu)), smu, 0.0);
  let ro = vec3f(0.0, r, 0.0);

  let tTop = raySphere(ro, rd, RT);
  let tGr = raySphere(ro, rd, RG);
  var tMax = tTop.y;
  if (tGr.x > 0.0) { tMax = tGr.x; }
  let cosT = dot(rd, sun);
  let pR = phaseRayleigh(cosT);
  let pM = phaseMie(cosT, 0.84);
  var L = vec3f(0.0);
  var T = vec3f(1.0);
  let STEPS = 48u;
  var tPrev = 0.0;
  for (var i = 0u; i < STEPS; i++) {
    let fa = (f32(i) + 1.0) / f32(STEPS);
    let tn = tMax * fa * fa;
    let dt = tn - tPrev;
    let t = tPrev + dt * 0.3;
    tPrev = tn;
    let p = ro + rd * t;
    let pr = length(p);
    let h = pr - RG;
    let m = medium(h, haze);
    let pmu = dot(p, sun) / pr;
    var sunT = sampleTrans(pr, pmu);
    if (sunBelowHorizon(pr, pmu)) { sunT = vec3f(0.0); }
    let msuv = vec2f(fromUnitToSubUvs(pmu * 0.5 + 0.5, MS_SIZE), fromUnitToSubUvs(clamp(h / (RT - RG), 0.0, 1.0), MS_SIZE));
    let ms = textureSampleLevel(msLUT, sampC, msuv, 0.0).rgb;
    let S = sunT * (m.rayS * pR + vec3f(m.mieS * pM)) + ms * (m.rayS + vec3f(m.mieS));
    let Ts = exp(-m.ext * dt);
    let ext = max(m.ext, vec3f(1e-9));
    L += T * (S - S * Ts) / ext;
    T *= Ts;
  }
  textureStore(dst, id.xy, vec4f(L, 1.0));
}
`;

// Functions for rendering the sky (background, env cube, ocean fog).
// Requires: F (Frame), transLUT, skyLUT, sampC declared by the including module.
const SKY_RENDER_FUNCS = NOISE_WGSL + /* wgsl */ `
const SKY_W: f32 = ${SKY_W}.0;
const SKY_H: f32 = ${SKY_H}.0;

fn camR() -> f32 { return RG + F.atmo.y; }

fn sampleTrans(r: f32, mu: f32) -> vec3f {
  return textureSampleLevel(transLUT, sampC, transRMuToUV(r, mu), 0.0).rgb;
}

fn sunIlluminance() -> vec3f {
  return sampleTrans(camR(), F.sunDir.y) * F.sunDir.w;
}

fn skyViewUV(dir: vec3f) -> vec2f {
  let r = camR();
  let vHorizon = rhoOf(r);
  let cosBeta = vHorizon / r;
  let beta = acos(clamp(cosBeta, -1.0, 1.0));
  let zha = PI - beta;
  let vzc = clamp(dir.y, -1.0, 1.0);
  var uv: vec2f;
  if (vzc >= -cosBeta) {
    var coord = acos(vzc) / zha;
    coord = 1.0 - coord;
    coord = sqrt(max(coord, 0.0));
    coord = 1.0 - coord;
    uv.y = coord * 0.5;
  } else {
    var coord = (acos(vzc) - zha) / beta;
    coord = sqrt(max(coord, 0.0));
    uv.y = coord * 0.5 + 0.5;
  }
  let dl = length(dir.xz);
  let sl = length(F.sunDir.xz);
  var lvc = 1.0;
  if (dl > 1e-6 && sl > 1e-6) { lvc = clamp(dot(dir.xz, F.sunDir.xz) / (dl * sl), -1.0, 1.0); }
  uv.x = sqrt(max(-lvc * 0.5 + 0.5, 0.0));
  return vec2f(fromUnitToSubUvs(uv.x, SKY_W), fromUnitToSubUvs(uv.y, SKY_H));
}

fn skyAtmo(dir: vec3f) -> vec3f {
  return textureSampleLevel(skyLUT, sampC, skyViewUV(dir), 0.0).rgb * F.sunDir.w;
}

// Hemisphere lookup shared with the reflection bake. u wraps at the azimuth cut.
fn skyMapUV(dir: vec3f) -> vec2f {
  let d = normalize(dir);
  let az = atan2(d.x, -d.z);
  let el = asin(clamp(d.y, 0.0, 1.0));
  return vec2f(az * (0.5 / PI) + 0.5, el * (2.0 / PI));
}
`;

// Clouds + full sky radiance (needs the same bindings as SKY_RENDER_FUNCS).
const SKY_CLOUD_FUNCS = /* wgsl */ `

// ---- clouds -------------------------------------------------------------
// Two thin, light-aware layers: broken low cumulus with cauliflower edges (2 km) and
// high cirrus wisps (7 km). Each is shaded with self-shadowing towards the sun, bright
// sun-facing rims, silver linings on thin back-lit parts and warm multiple scattering.
// Signed "edge" functions (cloud where > 0) and their density ramps. The edge value is
// what the sky pass differentiates (fwidth) to anti-alias the cloud silhouettes analytically.
// Shape evolution is a generation clock. Each generation crossfades the domain warp to a
// new offset so a mass bulges, splits, and merges. Harmonics must be integers: the clock
// wraps at CLOUD_MORPH_WRAP, and an integer multiple lands on the same boundary.
const CLOUD_MORPH_WRAP: u32 = 4096u;
fn morphOffset(gen: f32, salt: u32) -> vec2f {
  let idx = u32(gen) % CLOUD_MORPH_WRAP;
  let n = pcgHash(idx + salt);
  let m = pcgHash(idx + salt * 3u + 11u);
  let a = f32(n) * (6.28318530718 / 4294967296.0);
  let r = 1.5 + f32(m & 255u) * (1.5 / 255.0);
  return vec2f(cos(a), sin(a)) * r;
}
fn morphFlow(t: f32, salt: u32) -> vec2f {
  let i = floor(t);
  let f = t - i;
  let u = f * f * (3.0 - 2.0 * f);
  return mix(morphOffset(i, salt), morphOffset(i + 1.0, salt), u);
}
// Scroll is integer kilometres plus a fraction, so the noise lattice stays exact after a
// time lapse has carried the field far past what an f32 coordinate can resolve.
struct Axis { i: i32, f: f32 }
struct Pos { x: Axis, y: Axis }

fn gnoiseCell(cell: vec2i, f: vec2f) -> f32 {
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let a = dot(hashGrad(cell), f);
  let b = dot(hashGrad(cell + vec2i(1, 0)), f - vec2f(1.0, 0.0));
  let c = dot(hashGrad(cell + vec2i(0, 1)), f - vec2f(0.0, 1.0));
  let d = dot(hashGrad(cell + vec2i(1, 1)), f - vec2f(1.0, 1.0));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}
fn mulWide(a: u32, b: u32) -> vec2u {
  let a0 = a & 0xFFFFu;
  let a1 = a >> 16u;
  let b0 = b & 0xFFFFu;
  let b1 = b >> 16u;
  let p00 = a0 * b0;
  let p01 = a0 * b1;
  let p10 = a1 * b0;
  let p11 = a1 * b1;
  let mid = (p00 >> 16u) + (p01 & 0xFFFFu) + (p10 & 0xFFFFu);
  let lo = (p00 & 0xFFFFu) | ((mid & 0xFFFFu) << 16u);
  let hi = p11 + (p01 >> 16u) + (p10 >> 16u) + (mid >> 16u);
  return vec2u(lo, hi);
}
fn addWide(a: vec2u, b: vec2u) -> vec2u {
  let lo = a.x + b.x;
  let hi = a.y + b.y + select(0u, 1u, lo < a.x);
  return vec2u(lo, hi);
}
fn mulSigned(i: i32, m: u32) -> vec2u {
  if (i >= 0) { return mulWide(u32(i), m); }
  let w = mulWide(u32(-i), m);
  let lo = ~w.x + 1u;
  let hi = ~w.y + select(0u, 1u, lo == 0u);
  return vec2u(lo, hi);
}
fn axisMul(a: Axis, s: f32) -> Axis {
  let neg = s < 0.0;
  let mag = select(s, -s, neg);
  let sq = u32(mag * 1048576.0 + 0.5);
  var bits = mulSigned(a.i, sq);
  let fq = u32(clamp(a.f, 0.0, 0.999999) * 1048576.0);
  let extra = mulWide(fq, sq);
  bits = addWide(bits, vec2u((extra.y << 12u) | (extra.x >> 20u), extra.y >> 20u));
  if (neg) {
    let lo = ~bits.x + 1u;
    let hi = ~bits.y + select(0u, 1u, lo == 0u);
    bits = vec2u(lo, hi);
  }
  return Axis(bitcast<i32>((bits.y << 12u) | (bits.x >> 20u)), f32(bits.x & 1048575u) * (1.0 / 1048576.0));
}
fn axisAdd(a: Axis, b: Axis) -> Axis {
  var i = a.i + b.i;
  var f = a.f + b.f;
  if (f >= 1.0) { f -= 1.0; i += 1; }
  return Axis(i, f);
}
fn axisAddf(a: Axis, c: f32) -> Axis {
  let n = i32(floor(c));
  return axisAdd(a, Axis(n, c - f32(n)));
}
fn axisSub(q: f32, si: i32, sf: f32) -> Axis {
  let qi = i32(floor(q));
  var i = qi - si;
  var f = (q - f32(qi)) - sf;
  if (f < 0.0) { f += 1.0; i -= 1; }
  return Axis(i, f);
}
fn posScale(p: Pos, sx: f32, sy: f32) -> Pos { return Pos(axisMul(p.x, sx), axisMul(p.y, sy)); }
fn posAdd(p: Pos, v: vec2f) -> Pos { return Pos(axisAddf(p.x, v.x), axisAddf(p.y, v.y)); }
fn posRot(p: Pos) -> Pos {
  return Pos(
    axisAdd(axisMul(p.x, 0.8), axisMul(p.y, -0.6)),
    axisAdd(axisMul(p.x, 0.6), axisMul(p.y, 0.8))
  );
}
fn posNoise(p: Pos) -> f32 { return gnoiseCell(vec2i(p.x.i, p.y.i), vec2f(p.x.f, p.y.f)); }
fn layerPos(q: vec2f, low: bool) -> Pos {
  let ix = select(F.cloudKm.z, F.cloudKm.x, low);
  let iz = select(F.cloudKm.w, F.cloudKm.y, low);
  let fx = select(F.cloudHigh.x, F.cloudWind.x, low);
  let fz = select(F.cloudHigh.y, F.cloudWind.y, low);
  return Pos(axisSub(q.x, ix, fx), axisSub(q.y, iz, fz));
}
fn noiseAt(world: Pos, sx: f32, sy: f32, offset: vec2f) -> f32 {
  return posNoise(posAdd(posScale(world, sx, sy), offset));
}
fn cloudFbmHp(p: Pos, fp: f32, oct: i32, billow: f32) -> f32 {
  var s = 0.0;
  var a = 0.5;
  var q = p;
  var freq = 1.0;
  for (var i = 0; i < oct; i++) {
    let w = 1.0 - smoothstep(0.08, 0.28, fp * freq);
    var n = posNoise(q);
    if (i >= 2) { n = mix(n, abs(n) * 2.0 - 0.38, billow); }
    s += a * n * w;
    q = posAdd(posScale(posRot(q), 2.03, 2.03), vec2f(13.1, 7.7));
    freq *= 2.03;
    a *= 0.5;
  }
  return s;
}
fn lowEdge(q: vec2f, fp: f32, oct: i32) -> f32 {
  let scale = max(F.cloudShape.x, 0.1);
  // Scroll and evolution are integrated offsets, so a wind change cannot teleport the layer.
  let world = layerPos(q, true);
  let k = 0.38 / scale;
  var p = posScale(world, k, k);
  let morphT = F.cloudWind.w;
  // Detail churns several times per large-mass generation.
  let detail = morphFlow(morphT * 6.0, 17u);
  let w = vec2f(
    noiseAt(p, 0.3, 0.3, detail + vec2f(1.7, 9.2)),
    noiseAt(p, 0.3, 0.3, vec2f(detail.y, -detail.x) + vec2f(8.3, 2.8))
  );
  p = posAdd(p, w * 1.4);
  // slightly elongated cells (cloud streets), mildly billowy small scales for ragged edges
  let base = cloudFbmHp(posScale(p, 1.0, 1.7), fp * 0.65 / scale, oct, 0.35) * 1.3 + 0.5;
  let lf = 0.05 / scale;
  let form = morphFlow(morphT * 2.0, 29u);
  let lw = vec2f(
    noiseAt(world, lf * 0.5, lf * 0.5, form + vec2f(4.2, 1.1)),
    noiseAt(world, lf * 0.5, lf * 0.5, vec2f(form.y, -form.x) + vec2f(8.8, 2.4))
  );
  let large = noiseAt(world, lf, lf, lw * 0.9 + vec2f(3.1, 1.3)) * 0.7;
  return base + large - (1.0 - F.cloudP.y);
}
fn lowSoft(fp: f32) -> f32 { return (0.38 + min(fp * 0.65, 1.0) * 0.3) * F.cloudShape.z; }
fn lowDensity(q: vec2f, fp: f32, oct: i32) -> f32 {
  return clamp(lowEdge(q, fp, oct) / lowSoft(fp), 0.0, 1.0);
}
fn highEdge(q: vec2f, fp: f32, oct: i32) -> f32 {
  let scale = max(F.cloudHigh.w, 0.1);
  let world = layerPos(q, false);
  let morphT = F.cloudWind.w;
  // altostratus deck: smooth, slightly fibrous, and slower to reshape than the cumulus
  let fiber = morphFlow(morphT * 2.0, 47u);
  let p = posAdd(posRot(posScale(world, 0.09 / scale, 0.20 / scale)), fiber);
  let n = cloudFbmHp(p, fp * 0.2 / scale, oct, 0.0) * 1.25 + 0.5;
  let hf = 0.012 / scale;
  let form = morphFlow(morphT, 71u);
  let hw = vec2f(
    noiseAt(world, hf * 0.45, hf * 0.45, form * 0.8 + vec2f(2.2, 6.1)),
    noiseAt(world, hf * 0.45, hf * 0.45, vec2f(form.y, -form.x) * 0.8 + vec2f(7.4, 1.6))
  );
  let big = noiseAt(world, hf, hf, hw * 0.7 + vec2f(7.0, 3.0)) * 0.6;
  return n + big - (1.0 - F.atmo.z);
}
fn highSoft(fp: f32) -> f32 { return (0.85 + min(fp * 0.2, 1.0) * 0.3) * F.cloudShape.z; }
fn highDensity(q: vec2f, fp: f32, oct: i32) -> f32 {
  return clamp(highEdge(q, fp, oct) / highSoft(fp), 0.0, 1.0);
}

struct CloudHit { t: f32, q: vec2f, mu: f32, up: vec3f };
fn hitLayer(dir: vec3f, hc: f32) -> CloudHit {
  var h: CloudHit;
  let ro = vec3f(0.0, camR(), 0.0);
  h.t = raySphere(ro, dir, RG + hc).y;
  let p = ro + dir * h.t;
  h.up = p / length(p);
  h.q = p.xz + F.camPos.xz * 0.001;
  h.mu = max(dot(h.up, dir), 0.03);
  return h;
}

// d: density at the hit; s1..s3: densities 80 m / 250 m / 600 m towards the sun
fn shadeLayer(dir: vec3f, h: CloudHit, hc: f32, d: f32, s1: f32, s2: f32, s3: f32, sigma: f32, g: f32) -> vec4f {
  let tau = d * sigma / h.mu;
  let alpha = 1.0 - exp(-tau);
  let tauS = (d * 0.5 + s1 * 0.6 + s2 + s3 * 0.7) * sigma * 0.55;
  let Ts = exp(-tauS);
  // Direct sun on the deck fades out just below the horizon. The transmittance of a
  // sun that has already set is a dim red, and it was drawing a rim on night clouds.
  let sunC = sampleTrans(RG + hc, dot(h.up, F.sunDir.xyz)) * F.sunDir.w * smoothstep(-0.06, 0.04, F.sunDir.y);
  let cosT = dot(dir, F.sunDir.xyz);
  let ph = mix(phaseHG(cosT, g), phaseHG(cosT, -0.2), 0.25);
  let fwd = smoothstep(-0.2, 0.7, cosT);
  // single scattering: reflected when front-lit, transmitted through thin parts when back-lit
  let single = sunC * Ts * ph * mix(alpha * 0.55, tau * exp(-tau) * 2.2, fwd) * 3.0;
  // edges where density falls off towards the sun catch direct light
  let rim = clamp((d - s1) * 2.5, 0.0, 1.0);
  // multiple scattering: a low sun lights cloud tops and sun-facing flanks, not the bases we
  // see from below, so diffused sunlight shows mostly when looking towards the sun
  let toward = smoothstep(-0.3, 0.9, cosT);
  let ms = sunC * (0.025 + 0.22 * rim * F.cloudLight.z) * mix(1.0, Ts, 0.5) * alpha * (0.25 + 0.75 * toward);
  // bases are lit by the sky from the sides/below (horizon band + sea), cooler than the tops
  let amb = (skyAtmo(normalize(vec3f(dir.x, 0.03, dir.z))) * 0.26 + skyAtmo(vec3f(0.0, 1.0, 0.0)) * 0.42)
            * alpha * (1.0 - 0.35 * d) * F.cloudLight.w;
  // After dark the sun and the sky LUT go black. A cool ambient keeps the cloud body
  // readable with no moon, and moonlight brightens the faces turned toward the moon.
  let night = 1.0 - smoothstep(-0.05, 0.16, F.sunDir.y);
  var nightLit = vec3f(0.0);
  if (night > 0.001) {
    let moon = normalize(F.moonDir.xyz);
    let phase = 0.5 * (1.0 + dot(normalize(F.moonLight.xyz), -moon));
    let moonUp = smoothstep(-0.04, 0.12, moon.y) * step(0.001, F.moonDir.w);
    let moonE = F.moonDir.w * phase * moonUp;
    let towardMoon = smoothstep(-0.4, 0.85, dot(dir, moon));
    let cool = vec3f(0.62, 0.70, 0.88);
    let fill = (0.045 + 0.020 * moonE) * (1.0 - 0.35 * d);
    let edge = 0.014 * moonE * (0.35 + 0.65 * towardMoon) * (0.35 + 0.65 * rim) * Ts;
    nightLit = cool * (fill + edge) * alpha * F.cloudLight.w * night;
  }
  return vec4f(single + ms + amb + nightLit, alpha);
}

// returns (premultiplied radiance, fraction of the background sky hidden)
// aa: per-layer edge change per pixel (fwidth of the edge function); negative = estimate it
// from the pixel footprint (compute passes, which have no derivatives)
fn cloudLayers(dir: vec3f, pixAng: f32, aa: vec2f, sunT: ptr<function, f32>) -> vec4f {
  *sunT = 1.0;
  if (dir.y <= 0.0) { return vec4f(0.0); }
  let sxz = F.sunDir.xz / max(length(F.sunDir.xz), 1e-4);
  var lo = vec4f(0.0);
  var loVis = 1.0;
  if (F.cloudP.y > 0.001) {
    let hc = F.cloudP.x;
    let h = hitLayer(dir, hc);
    // clear band near the horizon, where the low sun shines under the clouds
    let far = 1.0 - smoothstep(18.0, 36.0, h.t);
    if (far > 0.0) {
      let fp = h.t * pixAng / h.mu;
      let e = lowEdge(h.q, fp, 7);
      let d = clamp(e / lowSoft(fp), 0.0, 1.0) * far;
      if (d > 0.002) {
        let s1 = lowDensity(h.q + sxz * 0.08, fp, 4) * far;
        let s2 = lowDensity(h.q + sxz * 0.25, fp, 3) * far;
        let s3 = lowDensity(h.q + sxz * 0.6, fp, 2) * far;
        lo = shadeLayer(dir, h, hc, d, s1, s2, s3, F.cloudLight.x, 0.75);
        // opacity saturates within a sliver of the density ramp, making a hard silhouette:
        // spread it over ~1.5 pixels
        let aw = select(fp * 0.38 * 2.5, aa.x, aa.x >= 0.0) * F.cloudShape.z;
        lo *= smoothstep(0.0, aw * 1.5 + 1e-6, e);
        loVis = exp(-h.t * 0.02 * (0.6 + 0.4 * F.atmo.x));
      }
    }
  }
  var hi = vec4f(0.0);
  var hiVis = 1.0;
  if (F.atmo.z > 0.001) {
    let hc = F.cloudShape.y;
    let h = hitLayer(dir, hc);
    let far = 1.0 - smoothstep(30.0, 70.0, h.t);
    if (far > 0.0) {
      let fp = h.t * pixAng / h.mu;
      let e = highEdge(h.q, fp, 6);
      let d = clamp(e / highSoft(fp), 0.0, 1.0) * far;
      if (d > 0.002) {
        let s1 = highDensity(h.q + sxz * 0.15, fp, 3) * far;
        let s2 = highDensity(h.q + sxz * 0.5, fp, 2) * far;
        hi = shadeLayer(dir, h, hc, d, s1, s2, s2, F.cloudLight.y, 0.80);
        let aw = select(fp * 0.2 * 2.5, aa.y, aa.y >= 0.0) * F.cloudShape.z;
        hi *= smoothstep(0.0, aw * 1.5 + 1e-6, e);
        hiVis = exp(-h.t * 0.010 * (0.6 + 0.4 * F.atmo.x));
      }
    }
  }
  *sunT = (1.0 - lo.a) * (1.0 - hi.a);
  // low layer in front; aerial perspective fades each layer into the haze without making
  // it transparent to the layer behind, or to the stars
  let col = lo.rgb * loVis + hi.rgb * hiVis * (1.0 - lo.a);
  let cover = lo.a + hi.a * (1.0 - lo.a);
  // The fade used to lower coverage, which let stars shine through solid clouds.
  // Put the missing atmosphere back into the color and keep the geometric coverage.
  let haze = skyAtmo(dir) * (lo.a * (1.0 - loVis) + hi.a * (1.0 - lo.a) * (1.0 - hiVis));
  return vec4f(col + haze, cover);
}

fn sunDisk(dir: vec3f) -> vec3f {
  if (F.sunDir.y <= -0.01) { return vec3f(0.0); }
  let c = dot(dir, F.sunDir.xyz);
  let ang = sqrt(max(2.0 * (1.0 - c), 0.0));
  let pix = F.screen.w * 2.0 * length(F.camUp.xyz) * 0.75;
  let edge = 1.0 - smoothstep(SUN_ANG_R - pix, SUN_ANG_R + pix, ang);
  if (edge <= 0.0) { return vec3f(0.0); }
  let x = min(ang / SUN_ANG_R, 1.0);
  let mu = sqrt(max(1.0 - x * x, 0.0));
  let limb = vec3f(1.0) - vec3f(0.397, 0.503, 0.652) * (1.0 - mu);
  let rad = F.sunDir.w / (PI * SUN_ANG_R * SUN_ANG_R);
  return rad * limb * edge * sampleTrans(camR(), max(dir.y, -0.01));
}

// Point-sample the star id. Linear filtering would blend neighbouring rhythms;
// the 2x2 under the sample is the same footprint the colour lookup uses.
fn starMark(uv: vec2f) -> f32 {
  let dims = vec2i(textureDimensions(starMap));
  let base = vec2i(floor(uv * vec2f(dims) - 0.5));
  var best = 0.0;
  for (var j = 0; j <= 1; j++) {
    for (var i = 0; i <= 1; i++) {
      var c = base + vec2i(i, j);
      c.x = (c.x % dims.x + dims.x) % dims.x;
      c.y = clamp(c.y, 0, dims.y - 1);
      best = max(best, textureLoad(starMap, c, 0).a);
    }
  }
  return best;
}

// Atmospheric scintillation. A point source flickers more as its line of sight
// crosses a thicker slab of turbulent air, and low bright stars shift colour.
// Frequencies are an integer number of cycles over the 600 s simulation loop,
// so the wrap does not pop. The environment cube asks for the mean (scintillate
// false) because a face is rebuilt only every few frames.
fn starScintillation(dir: vec3f, id: f32, peak: f32) -> vec3f {
  let elev = asin(clamp(dir.y, 0.0, 1.0)) * 57.2957795;
  let air = min(12.0, 1.0 / (max(dir.y, 0.0) + 0.50572 * pow(elev + 6.07995, -1.6364)));
  let sigma = min(0.88, F.nightP.z * 0.055 * pow(air, 1.22));
  let n = u32(id * 255.0 + 0.5);
  let h1 = pcgHash(n);
  let h2 = pcgHash(h1 ^ 0x9e3779b9u);
  let h3 = pcgHash(h2 ^ 0x85ebca6bu);
  let p1 = f32(h1) * (6.28318530718 / 4294967296.0);
  let p2 = f32(h2) * (6.28318530718 / 4294967296.0);
  let p3 = f32(h3) * (6.28318530718 / 4294967296.0);
  // A slow function of direction, so stars that share an 8-bit id still diverge,
  // while one splat (a fraction of a degree) stays in phase with itself.
  let sight = dot(dir, vec3f(4.0, 9.0, 2.0));
  let t = F.camPos.w;
  let burst = 0.62 + 0.38 * sin(t * (6.28318530718 * 0.35) + p1 + sight);
  let flick = sin(t * (6.28318530718 * 2.3) + p2 + sight) * 0.56
            + sin(t * (6.28318530718 * 3.7) + p3 + sight) * 0.30
            + sin(t * (6.28318530718 * 6.1) + p1 + sight) * 0.14;
  let flicker = 1.0 + sigma * burst * flick;
  let chroma = sigma * 0.5 * smoothstep(1.8, 5.5, air) * smoothstep(0.22, 0.8, peak);
  let tint = vec3f(
    sin(t * (6.28318530718 * 2.9) + p2 + sight),
    sin(t * (6.28318530718 * 2.9) + p3 + sight + 2.094395),
    sin(t * (6.28318530718 * 2.9) + p1 + sight + 4.188790)
  );
  return max(vec3f(0.05), vec3f(flicker) + tint * chroma);
}

fn starField(dir: vec3f, pixAng: f32, scintillate: bool) -> vec3f {
  let night = 1.0 - smoothstep(-0.15, -0.055, F.sunDir.y);
  if (night <= 0.0 || dir.y <= 0.0 || F.nightP.x <= 0.0) { return vec3f(0.0); }
  let eq = vec3f(dot(dir, F.starX.xyz), dot(dir, F.starY.xyz), dot(dir, F.moonUp.xyz));
  let uv = vec2f(fract(atan2(eq.y, eq.x) / (2.0 * PI) + 1.0),
                 0.5 - asin(clamp(eq.z, -1.0, 1.0)) / PI);
  let stars = textureSampleLevel(starMap, sampC, uv, 0.0).rgb;
  let gain = 0.35 + 2.65 * smoothstep(0.0, 0.35, F.nightP.x);
  // The default density keeps every catalog star. Lower values let faint stars disappear first.
  let cutoff = mix(0.48, 0.0, smoothstep(0.08, 0.55, F.nightP.x));
  let peak = max(stars.r, max(stars.g, stars.b));
  let keep = select(1.0, smoothstep(cutoff, min(cutoff + 0.07, 1.0), peak), cutoff > 0.001);
  let extinction = sampleTrans(camR(), max(dir.y, 0.0));
  let col = stars * gain * keep * F.nightP.y * night * extinction;
  if (!scintillate || F.nightP.z <= 0.001 || peak <= 0.001) { return col; }
  return col * starScintillation(dir, starMark(uv), peak);
}

const MOON_ANG_R: f32 = 0.00452;

fn moonFbm(p: vec2f) -> f32 {
  return gnoise(p) * 0.5 + gnoise(p * 2.1 + vec2f(5.2, 1.3)) * 0.25 +
         gnoise(p * 4.3 + vec2f(1.7, 9.2)) * 0.125 + gnoise(p * 8.7 + vec2f(8.3, 2.8)) * 0.0625;
}

fn mare(p: vec2f, c: vec2f, r: vec2f) -> f32 {
  let d = length((p - c) / r) + moonFbm(p * 5.0 + c * 13.0) * 0.55;
  return 1.0 - smoothstep(0.45, 1.25, d);
}

// Near-side albedo with lunar north up (x = right, y = up, in disc radii).
fn moonAlbedo(p: vec2f) -> f32 {
  var m = 0.0;
  m = max(m, mare(p, vec2f(-0.60, 0.10), vec2f(0.32, 0.58)));  // Oceanus Procellarum
  m = max(m, mare(p, vec2f(-0.26, 0.47), vec2f(0.36, 0.29)));  // Imbrium
  m = max(m, mare(p, vec2f(0.20, 0.38), vec2f(0.19, 0.19)));   // Serenitatis
  m = max(m, mare(p, vec2f(0.36, 0.10), vec2f(0.25, 0.19)));   // Tranquillitatis
  m = max(m, mare(p, vec2f(0.71, 0.29), vec2f(0.13, 0.11)));   // Crisium
  m = max(m, mare(p, vec2f(0.60, -0.14), vec2f(0.14, 0.21)));  // Fecunditatis
  m = max(m, mare(p, vec2f(0.40, -0.27), vec2f(0.11, 0.10)));  // Nectaris
  m = max(m, mare(p, vec2f(-0.17, -0.34), vec2f(0.21, 0.15))); // Nubium
  m = max(m, mare(p, vec2f(-0.51, -0.39), vec2f(0.11, 0.10))); // Humorum
  m = max(m, mare(p, vec2f(-0.02, 0.76), vec2f(0.50, 0.08)));  // Frigoris
  m = max(m, mare(p, vec2f(0.05, 0.05), vec2f(0.10, 0.09)) * 0.7); // Sinus Medii
  // maria vary in tone; highlands are bright and heavily cratered
  m *= 0.8 + 0.25 * moonFbm(p * 9.0 + vec2f(4.0, 7.0));
  var a = mix(1.0, 0.52, clamp(m, 0.0, 1.0));
  a *= 0.92 + 0.09 * moonFbm(p * 22.0) + 0.05 * gnoise(p * 61.0 + vec2f(3.1, 1.7)) * (1.0 - m * 0.6);
  // bright young craters and their ray systems
  let t = p - vec2f(-0.13, -0.72);
  let rays = pow(abs(sin(atan2(t.y, t.x) * 9.0 + 0.7)), 18.0) * exp(-length(t) * 2.6);
  a += 0.5 * exp(-dot(t, t) * 1500.0) + 0.14 * rays * (1.0 - m * 0.5);
  let c = p - vec2f(-0.33, 0.25);
  a += 0.3 * exp(-dot(c, c) * 2000.0);
  let k = p - vec2f(-0.65, 0.13);
  a += 0.25 * exp(-dot(k, k) * 2400.0);
  return a;
}

// Returns radiance and how much of the background the disc hides.
fn moonDisk(dir: vec3f, pixAng: f32) -> vec4f {
  if (F.moonDir.y <= -0.02 || F.moonDir.w <= 0.0) { return vec4f(0.0); }
  let moon = normalize(F.moonDir.xyz);
  let radius = MOON_ANG_R * F.moonLight.w;
  let cosA = dot(dir, moon);
  if (cosA < cos(radius * 8.0)) { return vec4f(0.0); }
  var up = F.moonUp.xyz - moon * dot(F.moonUp.xyz, moon);
  if (dot(up, up) < 1e-6) { up = vec3f(0.0, 1.0, 0.0) - moon * moon.y; }
  up = normalize(up);
  let right = normalize(cross(moon, up));
  let p = vec2f(dot(dir, right), dot(dir, up)) / radius;
  let dist = length(p);
  let aa = max(pixAng / radius, 0.02);
  let cover = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, dist);
  let sun = normalize(F.moonLight.xyz);
  let illum = 0.5 * (1.0 + dot(sun, -moon));
  // atmospheric extinction reddens and dims the moon low over the horizon
  let ext = sampleTrans(camR(), max(moon.y, 0.0));
  let daylight = smoothstep(-0.04, 0.2, F.sunDir.y);
  // keeps lit highlands just under white after tone mapping so the maria stay readable
  let gain = F.moonDir.w * 0.4 * mix(1.0, 4.0, daylight);
  // faint aureole of scattered moonlight, scaled by how much of the disc is lit
  let halo = illum * 0.025 * exp(-max(dist - 1.0, 0.0) * 0.9) * (1.0 - cover) * (1.0 - daylight);
  var col = vec3f(0.0);
  if (cover > 0.0) {
    let q = p / max(dist, 1.0);
    let mu = sqrt(max(1.0 - dot(q, q), 0.0));
    let n = right * q.x + up * q.y - moon * mu;
    let mu0 = dot(n, sun);
    // Lommel-Seeliger: the regolith shows almost no limb darkening, so the full moon is evenly bright
    // (blended toward flat so the lit side reads at its full extent near the terminator)
    let ls = mix(2.0 * max(mu0, 0.0) / (max(mu0, 0.0) + mu + 1e-4), 1.0, 0.55) * smoothstep(-0.015, 0.04, mu0);
    // earthshine on the night side is strongest near new moon
    let es = 0.01 * pow(1.0 - illum, 3.0) * (1.0 - daylight);
    col = vec3f(1.0, 0.96, 0.9) * moonAlbedo(q) * (ls + es) * cover;
  }
  return vec4f((col + vec3f(0.85, 0.9, 1.0) * halo) * gain * ext, cover);
}

// cover is the cloud's geometric opacity. Lighting can stay soft while a cloud that is
// already visible hides the stars and the moon.
fn nightSky(dir: vec3f, pixAng: f32, cover: f32, scintillate: bool) -> vec3f {
  let night = 1.0 - smoothstep(-0.12, 0.015, F.sunDir.y);
  let base = vec3f(0.002, 0.004, 0.009) * F.nightP.w * night * (0.35 + 0.65 * max(dir.y, 0.0));
  let m = moonDisk(dir, pixAng);
  let starCover = smoothstep(0.015, 0.08, cover);
  let points = (starField(dir, pixAng, scintillate) * (1.0 - m.a) + m.rgb) * (1.0 - starCover);
  return base * (1.0 - cover) + points;
}

fn skyRadiance(dirIn: vec3f, withSun: bool, pixAng: f32) -> vec3f {
  var dir = dirIn;
  dir.y = max(dir.y, 0.0005);
  dir = normalize(dir);
  var L = skyAtmo(dir);
  var sunT = 1.0;
  let cl = cloudLayers(dir, pixAng, vec2f(-1.0), &sunT);
  L = L * (1.0 - cl.a) + cl.rgb;
  L += nightSky(dir, pixAng, cl.a, false);
  if (withSun) { L += sunDisk(dir) * sunT; }
  return applyRainSky(dir, L);
}

// Sunlight that reaches a ground point through both cloud decks. The layer is sampled
// where the sun ray crosses it, with a wide footprint so the shadow edge is soft, as a
// real cloud shadow is a few tens of metres wide at the ground.
fn cloudShadowAt(world: vec3f) -> f32 {
  let s = F.sunDir.xyz;
  if (F.cloudP.w <= 0.001 || s.y <= 0.0) { return 1.0; }
  let hk = world.y * 0.001;
  let sy = max(s.y, 0.06);
  var tau = 0.0;
  if (F.cloudP.y > 0.001) {
    let q = world.xz * 0.001 + s.xz / sy * max(F.cloudP.x - hk, 0.0);
    tau += lowDensity(q, 0.06, 5) * F.cloudLight.x * 1.4;
  }
  if (F.atmo.z > 0.001) {
    let q = world.xz * 0.001 + s.xz / sy * max(F.cloudShape.y - hk, 0.0);
    tau += highDensity(q, 0.12, 4) * F.cloudLight.y * 0.9;
  }
  return mix(1.0, exp(-tau), F.cloudP.w);
}
`;

// Aerial perspective: a camera-aligned froxel volume (Hillaire 2020). Each column marches
// its view ray once and stores in-scattered radiance (rgb, without the solar scale) and
// mean transmittance (a) at the far end of every depth slice. Slices are spaced on a
// square-root scale, so the near kilometres that frame the landscape get most of them.
const AP_LUT = FRAME_WGSL + ATMO_CORE_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var msLUT: texture_2d<f32>;
@group(0) @binding(3) var sampC: sampler;
@group(0) @binding(4) var dst: texture_storage_3d<rgba16float, write>;
const AP_N: u32 = ${AP_RES}u;
const AP_MAX: f32 = ${AP_MAX_KM}.0;

fn sampleTrans(r: f32, mu: f32) -> vec3f {
  return textureSampleLevel(transLUT, sampC, transRMuToUV(r, mu), 0.0).rgb;
}

@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= AP_N || id.y >= AP_N) { return; }
  let uv = (vec2f(id.xy) + 0.5) / f32(AP_N);
  let ndc = vec2f(uv.x * 2.0 - 1.0, 1.0 - uv.y * 2.0);
  let dir = normalize(F.camFwd.xyz + ndc.x * F.camRight.xyz + ndc.y * F.camUp.xyz);
  let haze = F.atmo.x;
  let sun = F.sunDir.xyz;
  let ro = vec3f(0.0, RG + F.atmo.y, 0.0);
  let cosT = dot(dir, sun);
  let pR = phaseRayleigh(cosT);
  let pM = phaseMie(cosT, 0.8);
  var L = vec3f(0.0);
  var T = vec3f(1.0);
  var t0 = 0.0;
  for (var z = 0u; z < AP_N; z++) {
    let a = f32(z + 1u) / f32(AP_N);
    let t1 = a * a * AP_MAX;
    let dt = (t1 - t0) / 3.0;
    for (var s = 0u; s < 3u; s++) {
      let t = t0 + (f32(s) + 0.5) * dt;
      let p = ro + dir * t;
      let pr = length(p);
      let h = pr - RG;
      let m = medium(h, haze);
      let pmu = dot(p, sun) / pr;
      var sunT = sampleTrans(pr, pmu);
      if (sunBelowHorizon(pr, pmu)) { sunT = vec3f(0.0); }
      let msuv = vec2f(fromUnitToSubUvs(pmu * 0.5 + 0.5, MS_SIZE), fromUnitToSubUvs(clamp(h / (RT - RG), 0.0, 1.0), MS_SIZE));
      let ms = textureSampleLevel(msLUT, sampC, msuv, 0.0).rgb;
      let S = sunT * (m.rayS * pR + vec3f(m.mieS * pM)) + ms * (m.rayS + vec3f(m.mieS));
      let Ts = exp(-m.ext * dt);
      let ext = max(m.ext, vec3f(1e-9));
      L += T * (S - S * Ts) / ext;
      T *= Ts;
    }
    textureStore(dst, vec3u(id.x, id.y, z), vec4f(L, dot(T, vec3f(1.0 / 3.0))));
    t0 = t1;
  }
}
`;

// Ground cloud-shadow map and the sky hemisphere sampled by water. Both used to be
// evaluated inside the landscape shader, once per pixel. A few hundred texels of the
// real cloud function is enough: shadows are soft, and ripples blur the reflection.
const SHADOW_N = 384;
const SHADOW_SPAN = 20000;
const REFL_W = 256;
const REFL_H = 96;

const SKY_BAKE_BINDINGS = /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
@group(0) @binding(1) var transLUT: texture_2d<f32>;
@group(0) @binding(2) var skyLUT: texture_2d<f32>;
@group(0) @binding(3) var sampC: sampler;
@group(0) @binding(4) var starMap: texture_2d<f32>;
`;

function cloudShadowBakeWGSL(filterA) {
  return FRAME_WGSL + ATMO_CORE_WGSL + SKY_BAKE_BINDINGS + /* wgsl */ `
@group(0) @binding(5) var clipA: texture_2d_array<f32>;
@group(0) @binding(6) var clipB: texture_2d_array<f32>;
@group(0) @binding(7) var<uniform> CL: ClipLevels;
struct ShadowBake { origin: vec2f, texel: f32, span: f32 };
@group(0) @binding(8) var<uniform> S: ShadowBake;
@group(0) @binding(9) var dst: texture_storage_2d<rgba16float, write>;
` + RAIN_STRUCT + /* wgsl */ `
@group(0) @binding(10) var<uniform> Rain: RainU;
` + SKY_RENDER_FUNCS + SKY_CLOUD_FUNCS + RAIN_FUNCS + clipSampleWGSL(filterA) + /* wgsl */ `
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= ${SHADOW_N}u || id.y >= ${SHADOW_N}u) { return; }
  let xz = S.origin + (vec2f(id.xy) + 0.5) * S.texel;
  let lv = clamp(clipFinest(xz), 0.0, f32(CLIP_L - 1));
  let h = clipHeight(xz, lv);
  var sh = cloudShadowAt(vec3f(xz.x, h, xz.y));
  // The included sky code names these resources. Touch them so the bind-group
  // layout still has every binding after unused functions are stripped.
  if (Rain.wind.w < -1e9) {
    sh += textureSampleLevel(transLUT, sampC, vec2f(0.5), 0.0).r;
    sh += textureSampleLevel(skyLUT, sampC, vec2f(0.5), 0.0).r;
    sh += textureLoad(starMap, vec2i(0), 0).r;
    sh += clipB1(xz, 0).x;
  }
  textureStore(dst, id.xy, vec4f(sh, 0.0, 0.0, 1.0));
}
`;
}

function skyReflectBakeWGSL() {
  return FRAME_WGSL + ATMO_CORE_WGSL + SKY_BAKE_BINDINGS + RAIN_STRUCT + /* wgsl */ `
@group(0) @binding(5) var<uniform> Rain: RainU;
@group(0) @binding(6) var dst: texture_storage_2d<rgba16float, write>;
` + SKY_RENDER_FUNCS + SKY_CLOUD_FUNCS + RAIN_FUNCS + /* wgsl */ `
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= ${REFL_W}u || id.y >= ${REFL_H}u) { return; }
  let uv = (vec2f(id.xy) + 0.5) / vec2f(${REFL_W}.0, ${REFL_H}.0);
  let az = (uv.x * 2.0 - 1.0) * PI;
  let el = uv.y * (PI * 0.5);
  let ce = cos(el);
  let dir = vec3f(sin(az) * ce, sin(el), -cos(az) * ce);
  let pix = (PI * 0.5) / ${REFL_H}.0;
  textureStore(dst, id.xy, vec4f(skyRadiance(dir, false, pix), 1.0));
}
`;
}


// ---- js/wgsl/terrain.js ----
// Procedural landscape: eroded mountains, a meandering river valley, a one-sided coastline,
// lake basins, and the vegetation / rock / snow masks that go with them. The height function is baked into
// camera-centred clipmaps (one 512² layer per level, texel doubling per level) and the
// renderer samples those instead of re-evaluating the noise per pixel.

// Clipmap lookups for the render passes. The including module declares clipA, clipB (both
// texture_2d_array<f32>), sampC (linear clamp sampler) and CL (ClipLevels). rgba32float
// is only filterable with the float32-filterable feature; without it A is filtered by hand.
function clipSampleWGSL(filterA) {
  const loadA = filterA ? /* wgsl */ `
fn clipA1(xz: vec2f, L: i32) -> vec4f { return textureSampleLevel(clipA, sampC, clipUV(xz, L), L, 0.0); }
` : /* wgsl */ `
fn clipA1(xz: vec2f, L: i32) -> vec4f {
  let tc = clipUV(xz, L) * CLIP_N - 0.5;
  let i = vec2i(floor(tc));
  let f = tc - floor(tc);
  let m = vec2i(${CLIP_RES - 1});
  let a = textureLoad(clipA, clamp(i, vec2i(0), m), L, 0);
  let b = textureLoad(clipA, clamp(i + vec2i(1, 0), vec2i(0), m), L, 0);
  let c = textureLoad(clipA, clamp(i + vec2i(0, 1), vec2i(0), m), L, 0);
  let d = textureLoad(clipA, clamp(i + vec2i(1, 1), vec2i(0), m), L, 0);
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
`;
  return /* wgsl */ `
struct ClipLevels { lv: array<vec4f, ${CLIP_LEVELS}> };   // xy = world position of texel 0, z = texel (m)
const CLIP_N: f32 = ${CLIP_RES}.0;
const CLIP_L: i32 = ${CLIP_LEVELS};
const CLIP_T0: f32 = ${CLIP_TEXEL0}.0;
fn clipUV(xz: vec2f, L: i32) -> vec2f {
  let o = CL.lv[L];
  return ((xz - o.xy) / o.z + 0.5) / CLIP_N;
}
// 1 well inside level L, 0 at the edge that is still safe to sample.
fn clipInside(xz: vec2f, L: i32) -> f32 {
  let o = CL.lv[L];
  let hw = o.z * CLIP_N * 0.5;
  let c = o.xy + vec2f(hw);
  let d = max(abs(xz.x - c.x), abs(xz.y - c.y));
  return clamp((0.94 * hw - d) / (0.24 * hw), 0.0, 1.0);
}
// Finest level that holds xz, continuous so neighbouring vertices agree (no cracks).
fn clipFinest(xz: vec2f) -> f32 {
  for (var L = 0; L < CLIP_L; L++) {
    let a = clipInside(xz, L);
    if (a > 0.0) { return f32(L) + 1.0 - a; }
  }
  return f32(CLIP_L - 1);
}
` + loadA + /* wgsl */ `
fn clipB1(xz: vec2f, L: i32) -> vec4f { return textureSampleLevel(clipB, sampC, clipUV(xz, L), L, 0.0); }
fn clipA2(xz: vec2f, lf: f32) -> vec4f {
  let l0 = min(i32(floor(lf)), CLIP_L - 1);
  let t = lf - f32(l0);
  let a = clipA1(xz, l0);
  if (t < 0.002 || l0 >= CLIP_L - 1) { return a; }
  return mix(a, clipA1(xz, l0 + 1), t);
}
fn clipB2(xz: vec2f, lf: f32) -> vec4f {
  let l0 = min(i32(floor(lf)), CLIP_L - 1);
  let t = lf - f32(l0);
  let a = clipB1(xz, l0);
  if (t < 0.002 || l0 >= CLIP_L - 1) { return a; }
  return mix(a, clipB1(xz, l0 + 1), t);
}
fn clipHeight(xz: vec2f, lf: f32) -> f32 { return clipA2(xz, lf).x; }
`;
}

// Valley path, water level and the height field. Requires F (Frame) and NOISE_WGSL.
const TERRAIN_FUNCS = /* wgsl */ `
fn seedU() -> u32 { return u32(F.mist.w) * 2654435761u; }
fn seedGrad(i: vec2i) -> vec2f {
  let h = pcgHash(u32(i.x) * 1664525u + pcgHash(u32(i.y) + 1013904223u + seedU()));
  let a = f32(h) * (6.28318530718 / 4294967296.0);
  return vec2f(cos(a), sin(a));
}
fn seedHash2(i: vec2i) -> vec2f {
  let h = pcgHash(u32(i.x) * 2246822519u + pcgHash(u32(i.y) * 3266489917u + seedU()));
  let g = pcgHash(h);
  return vec2f(f32(h & 0xFFFFu), f32(g & 0xFFFFu)) * (1.0 / 65535.0);
}
// Gradient noise with its analytic derivative: (value, d/dx, d/dy), value in about [-0.7, 0.7].
fn gnoised(p: vec2f) -> vec3f {
  let i = vec2i(floor(p));
  let f = p - floor(p);
  let u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);
  let du = 30.0 * f * f * (f * (f - 2.0) + 1.0);
  let ga = seedGrad(i);
  let gb = seedGrad(i + vec2i(1, 0));
  let gc = seedGrad(i + vec2i(0, 1));
  let gd = seedGrad(i + vec2i(1, 1));
  let va = dot(ga, f);
  let vb = dot(gb, f - vec2f(1.0, 0.0));
  let vc = dot(gc, f - vec2f(0.0, 1.0));
  let vd = dot(gd, f - vec2f(1.0, 1.0));
  let k = va - vb - vc + vd;
  let v = va + u.x * (vb - va) + u.y * (vc - va) + u.x * u.y * k;
  let d = ga + u.x * (gb - ga) + u.y * (gc - ga) + u.x * u.y * (ga - gb - gc + gd)
        + du * (u.yx * k + vec2f(vb - va, vc - va));
  return vec3f(v, d);
}
fn snoise(p: vec2f) -> f32 { return gnoised(p).x; }
fn fbm2(p: vec2f, oct: i32) -> f32 {
  var s = 0.0; var a = 0.5; var q = p;
  for (var i = 0; i < oct; i++) {
    s += a * snoise(q);
    q = mat2x2f(0.8, -0.6, 0.6, 0.8) * q * 2.03 + vec2f(17.1, 3.7);
    a *= 0.5;
  }
  return s;
}

// ---- valley path --------------------------------------------------------------------
// The valley centre line is x = valleyX(z). The river meanders inside the valley floor and
// the flight follows the valley, so the camera code (scenes.js) mirrors these functions.
fn valleyX(z: f32) -> f32 {
  return F.pathA.x * sin(F.pathK.x * z + F.pathPh.x)
       + F.pathA.y * sin(F.pathK.y * z + F.pathPh.y)
       + F.pathA.z * sin(F.pathK.z * z + F.pathPh.z);
}
fn valleyDX(z: f32) -> f32 {
  return F.pathA.x * F.pathK.x * cos(F.pathK.x * z + F.pathPh.x)
       + F.pathA.y * F.pathK.y * cos(F.pathK.y * z + F.pathPh.y)
       + F.pathA.z * F.pathK.z * cos(F.pathK.z * z + F.pathPh.z);
}
fn riverX(z: f32) -> f32 {
  let k = F.pathK.w;
  return valleyX(z) + F.pathA.w * (sin(k * z + F.pathPh.w) + 0.35 * sin(2.3 * k * z + 1.7 + F.pathPh.w));
}
fn riverDX(z: f32) -> f32 {
  let k = F.pathK.w;
  return valleyDX(z) + F.pathA.w * k * (cos(k * z + F.pathPh.w) + 0.805 * cos(2.3 * k * z + 1.7 + F.pathPh.w));
}
// The flight runs towards -z, upstream, so the water climbs gently ahead of the camera.
fn waterLevel(z: f32) -> f32 { return F.water.x - F.water.y * z; }
// Signed distance across the river, and its local half-width.
fn riverOffset(xz: vec2f) -> f32 {
  let s = riverDX(xz.y);
  return (xz.x - riverX(xz.y)) * inverseSqrt(1.0 + s * s);
}
fn riverHalfWidth(z: f32) -> f32 {
  return F.valley.z * (1.0 + 0.28 * snoise(vec2f(z * 0.0021, 4.7)) + 0.12 * snoise(vec2f(z * 0.011, 9.1)));
}

// ---- eroded mountains ---------------------------------------------------------------
// Gully filter after Clay John's "Eroded Terrain Noise": overlapping cosine stripes aligned
// with the local downhill direction carve branching ravines into the base relief.
fn gullyCells(p: vec2f, dir: vec2f) -> vec3f {
  let ip = vec2i(floor(p));
  let fp = p - floor(p);
  var va = vec3f(0.0);
  var wt = 0.0;
  for (var j = -2; j <= 1; j++) {
    for (var i = -2; i <= 1; i++) {
      let o = vec2i(i, j);
      let h = seedHash2(ip - o) * 0.5;
      let pp = fp + vec2f(o) - h;
      let d = dot(pp, pp);
      let w = exp(-d * 2.0);
      wt += w;
      let mag = dot(pp, dir) * 6.28318530718;
      va += vec3f(cos(mag), -sin(mag) * dir) * w;
    }
  }
  return va / wt;
}

// Normalised mountain field, about 0 (valley bottoms) to 1 (summits). Octaves shorter
// than about two texels are faded out so every clipmap level is its own prefiltered copy.
fn mountainField(xz: vec2f, texel: f32) -> f32 {
  let S = F.relief.z;
  var p = xz / S;
  let warp = vec2f(snoise(p * 0.31 + vec2f(5.2, 1.3)), snoise(p * 0.31 + vec2f(1.7, 9.2)));
  p += warp * 0.7;
  // Low octaves keep their analytic gradient (no rotation) to steer the gullies downhill.
  var h = 0.0;
  var a = 0.5;
  var f = 1.0;
  var d = vec2f(0.0);
  var g = vec2f(0.0);
  let ridge = F.relief.y;
  var q = p;
  for (var i = 0; i < 11; i++) {
    let wl = S / f;
    let keep = smoothstep(2.0 * texel, 4.0 * texel, wl);
    if (keep <= 0.0) { break; }
    let n = gnoised(q);
    // ridged noise with a rounded crest: broad octaves get broad shoulders, not knife edges
    let kr = 0.16 * (1.3 - ridge) * pow(0.62, f32(i));
    let sa = sqrt(n.x * n.x + kr * kr);
    let v = mix(n.x, 0.42 + kr - sa, ridge);
    let dv = mix(n.yz, -(n.x / sa) * n.yz, ridge);
    d += dv;
    // derivative damping: steep parts of coarse octaves get less fine detail (IQ)
    let damp = 1.0 / (1.0 + dot(d, d) * 0.18);
    h += a * v * damp * keep;
    if (i < 3) { g += a * f * dv; }
    a *= 0.5;
    f *= 2.0;
    if (i < 2) { q = q * 2.0 + vec2f(1.3, 7.1); }
    else { q = mat2x2f(0.8, -0.6, 0.6, 0.8) * q * 2.0 + vec2f(3.1, 1.7); }
  }
  // valley bottoms flatten out, summits keep rising (no mesa tops)
  let x = max((h + 0.5) / 1.1, 0.0);
  var m = 1.25 * x * x / (x + 0.25);
  // gullies: strongest on mid and upper slopes, absent on the valley floors
  let gs = F.relief.w * smoothstep(0.12, 0.45, m);
  if (gs > 0.0) {
    let dir = vec2f(g.y, -g.x);
    var e = vec3f(0.0);
    var ga = 1.0;
    var gf = 3.0;
    for (var i = 0; i < 5; i++) {
      let wl = S / gf;
      let keep = smoothstep(2.0 * texel, 4.0 * texel, wl);
      if (keep <= 0.0) { break; }
      e += gullyCells(p * gf, dir + e.zy * vec2f(1.0, -1.0)) * ga * keep * vec3f(1.0, gf, gf);
      ga *= 0.4;
      gf *= 2.0;
    }
    m += e.x * 0.055 * gs;
  }
  return m;
}

// Signed metres from the coast path: positive is inland (+x, on the right as the
// flight runs toward -z), negative is open water.
fn coastOffset(xz: vec2f) -> f32 {
  let s = valleyDX(xz.y);
  return (xz.x - valleyX(xz.y)) * inverseSqrt(1.0 + s * s);
}

// Shoreline country. The coast path is the waterline. Coves run out as sand; headlands
// stand up as cliffs. Seaward of the line the bed drops through a shelf into open ocean,
// with a few stacks where a ridge fails to quite reach shore.
fn coastHeight(xz: vec2f, texel: f32, m: f32, wl: f32) -> f32 {
  let z = xz.y;
  let wig = snoise(vec2f(z * 0.00035, 3.1)) * 260.0
          + snoise(vec2f(z * 0.0013, 8.4)) * 70.0
          + snoise(vec2f(z * 0.006, 1.8)) * 16.0;
  let d = coastOffset(xz) + wig;
  let cliff = smoothstep(-0.12, 0.38, snoise(vec2f(z * 0.00028, 5.7)));
  var micro = 0.0;
  if (texel < 24.0) {
    micro = snoise(xz * (1.0 / 61.0) + vec2f(3.3, 8.1)) * 1.3;
    if (texel < 6.0) { micro += snoise(xz * (1.0 / 17.0) + vec2f(9.4, 2.2)) * 0.4; }
  }
  if (d < 0.0) {
    let depth = -d;
    let near = 1.0 - exp(-depth / 70.0);
    let shelf = smoothstep(180.0, 2800.0, depth);
    let abyss = smoothstep(1600.0, 12000.0, depth);
    var h = wl - 0.35 - near * 5.5 - shelf * 18.0 - abyss * 55.0;
    if (texel < 24.0 && depth < 500.0) {
      h += snoise(xz * 0.015 + vec2f(1.0, 4.0)) * 0.4 * (1.0 - shelf);
    }
    let stackN = smoothstep(0.58, 0.82, snoise(xz * (1.0 / 420.0) + vec2f(4.2, 1.1)) * 0.5 + 0.5);
    let stack = smoothstep(0.5, 0.84, m) * stackN * (0.3 + 0.7 * cliff) * (1.0 - smoothstep(40.0, 560.0, depth));
    let stackH = wl + 5.0 + max(m - 0.35, 0.0) * 80.0;
    return mix(h, stackH, stack);
  }
  let beachW = mix(max(F.valley.y, 30.0), 18.0, cliff);
  let bluff = mix(5.0, 34.0 + 100.0 * smoothstep(0.22, 0.78, m), cliff);
  let face = smoothstep(0.0, mix(beachW, 12.0, cliff), d);
  let terrace = mix(0.35, bluff, face);
  let reach = max(F.valley.x, beachW + 500.0);
  let rise = smoothstep(beachW * 0.55, reach, d);
  let peaks = max(m - 0.04, 0.0) * F.relief.x;
  var hLand = mix(terrace, max(terrace * 0.22, peaks), rise);
  if (cliff < 0.5 && texel < 48.0) {
    hLand += snoise(xz * (1.0 / 95.0) + vec2f(2.0, 6.0)) * 0.7 * (1.0 - rise) * smoothstep(1.2, 3.5, terrace);
  }
  return wl + hLand + micro * mix(0.2, 1.0, rise);
}

// Terrain height in metres.
fn terrainHeight(xz: vec2f, texel: f32) -> f32 {
  let m = mountainField(xz, texel);
  let z = xz.y;
  let wl = waterLevel(z);
  if (F.water.w > 0.5) { return coastHeight(xz, texel, m, wl); }
  var shape = 1.0;
  if (F.valley.x > 0.0) {
    let s = valleyDX(z);
    let ad = abs(xz.x - valleyX(z)) * inverseSqrt(1.0 + s * s);
    let wall = smoothstep(F.valley.y, F.valley.y + F.valley.x, ad);
    shape = wall * wall * (1.6 - 0.6 * wall);
  }
  // fine ground relief: hummocks, terraces and old channels on every floor
  var micro = 0.0;
  if (texel < 24.0) {
    micro = snoise(xz * (1.0 / 61.0) + vec2f(3.3, 8.1)) * 2.2;
    if (texel < 6.0) { micro += snoise(xz * (1.0 / 17.0) + vec2f(9.4, 2.2)) * 0.7; }
  }
  let base = (m - F.biome.z) * F.relief.x;
  var h = wl + F.valley.w + base + micro;
  if (F.valley.x > 0.0) {
    // The valley is a trough cut out of the full mountain field, so its walls keep every
    // ridge and gully; a smooth max holds the floor (with a gentle rise towards the walls).
    let cut = base - (1.0 - shape) * F.relief.x * 0.85;
    let floorRise = (1.0 - shape) * max(m - F.biome.z, 0.0) * 14.0;
    let a = cut - floorRise;
    h = wl + F.valley.w + floorRise + 0.5 * (a + sqrt(a * a + 900.0)) + micro;
  }
  // river channel
  if (F.valley.z > 0.0) {
    let rw = riverHalfWidth(z);
    let ar = abs(riverOffset(xz));
    let x = ar / rw;
    let bed = wl - 0.6 - 2.8 * max(1.0 - x * x, 0.0);
    // gravel bars come and go along each bank; elsewhere the wooded bank meets the water
    let side = select(0.0, 17.0, riverOffset(xz) > 0.0);
    let barK = smoothstep(0.05, 0.45, snoise(vec2f(z * (1.0 / 420.0), side + 2.3)));
    let bankH = wl + mix(2.8, 0.45, barK) + 1.8 * smoothstep(1.0, 3.2, x);
    h = mix(h, min(h, bankH), 1.0 - smoothstep(2.2, 5.5, x));
    h = mix(min(h, bed), h, smoothstep(0.8, 1.12, x));
  }
  return h;
}
`;

// One clipmap level, height only. B.xy is the world position of texel (0, 0).
const BAKE_UNIFORM = /* wgsl */ `
struct Bake { origin: vec2f, texel: f32, level: f32 };
@group(0) @binding(1) var<uniform> B: Bake;
`;

const CLIP_HEIGHT = FRAME_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
` + BAKE_UNIFORM + /* wgsl */ `
@group(0) @binding(2) var dst: texture_storage_2d_array<r32float, write>;
` + NOISE_WGSL + TERRAIN_FUNCS + /* wgsl */ `
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= ${CLIP_RES}u || id.y >= ${CLIP_RES}u) { return; }
  let xz = B.origin + vec2f(id.xy) * B.texel;
  textureStore(dst, id.xy, u32(B.level), vec4f(terrainHeight(xz, B.texel), 0.0, 0.0, 0.0));
}
`;

// Gradient, curvature and the land-cover masks for one level.
//   A = (height, dh/dx, dh/dz, curvature)
//   B = (tree density, conifer share, rock exposure, snow)
const CLIP_DERIVE = FRAME_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
` + BAKE_UNIFORM + /* wgsl */ `
@group(0) @binding(2) var src: texture_2d_array<f32>;
@group(0) @binding(3) var dstA: texture_storage_2d_array<rgba32float, write>;
@group(0) @binding(4) var dstB: texture_storage_2d_array<rgba16float, write>;
` + NOISE_WGSL + TERRAIN_FUNCS + /* wgsl */ `
fn hAt(c: vec2i) -> f32 {
  let q = clamp(c, vec2i(0), vec2i(${CLIP_RES - 1}));
  return textureLoad(src, q, i32(B.level), 0).r;
}
@compute @workgroup_size(8, 8, 1)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= ${CLIP_RES}u || id.y >= ${CLIP_RES}u) { return; }
  let c = vec2i(id.xy);
  let h = hAt(c);
  let hl = hAt(c - vec2i(1, 0));
  let hr = hAt(c + vec2i(1, 0));
  let hd = hAt(c - vec2i(0, 1));
  let hu = hAt(c + vec2i(0, 1));
  let tx = B.texel;
  // one-sided at the border, so the edge texels keep a sensible slope
  let ex = select(2.0, 1.0, c.x == 0 || c.x == ${CLIP_RES - 1});
  let ez = select(2.0, 1.0, c.y == 0 || c.y == ${CLIP_RES - 1});
  let grad = vec2f((hr - hl) / (ex * tx), (hu - hd) / (ez * tx));
  // curvature over at least 8 m, so it describes landforms rather than texel noise
  let k = max(1, i32(ceil(8.0 / tx)));
  let lap = (hAt(c - vec2i(k, 0)) + hAt(c + vec2i(k, 0)) + hAt(c - vec2i(0, k)) + hAt(c + vec2i(0, k)) - 4.0 * h)
          / (f32(k * k) * tx * tx);

  let xz = B.origin + vec2f(id.xy) * tx;
  let wl = waterLevel(xz.y);
  let above = h - wl;
  let slope = length(grad);

  // stands, glades and clearings
  let stand = fbm2(xz * (1.0 / 420.0) + vec2f(7.0, 2.0), 3) * 0.5 + 0.5;
  let patchy = fbm2(xz * (1.0 / 95.0) + vec2f(1.0, 11.0), 2);
  let clear = F.forest2.w;
  let open = smoothstep(clear - 0.08, clear + 0.08, stand + patchy * 0.18);
  let lineNoise = fbm2(xz * (1.0 / 160.0) + vec2f(4.0, 6.0), 3);
  let treeline = F.forest2.y + lineNoise * 90.0;
  let alpine = 1.0 - smoothstep(treeline - 160.0, treeline + 30.0, above);
  // forest clings to slopes up to about 50 degrees; ledges break up steeper walls
  let steep = 1.0 - smoothstep(1.15, 1.8, slope + patchy * 0.4);
  var shore = smoothstep(0.15, 1.0, above + patchy * 0.6);
  if (F.water.w > 0.5) {
    // open sand and scrub along the beach; the stand closes up the slope
    shore = smoothstep(3.5, 22.0, above + patchy * 3.0);
  }
  // open bog and fen on the flats just above the water
  let bog = F.biome.y * (1.0 - smoothstep(0.5, 6.0, above)) * smoothstep(-0.1, 0.25, fbm2(xz * (1.0 / 140.0), 2));
  // clearings are never bare: scattered regrowth and saplings
  let regrow = mix(0.18, 1.0, open);
  var dens = F.forest.x * regrow * alpine * steep * shore * (1.0 - 0.85 * bog);
  // stunted, thinning trees near the treeline
  dens *= mix(1.0, 0.35, smoothstep(treeline - 260.0, treeline - 60.0, above));

  let conif = clamp(F.forest.w + (above / max(F.forest2.y, 1.0)) * 0.3 + lineNoise * 0.3 + patchy * 0.18, 0.0, 1.0);

  // rock on steep and convex ground, and everywhere well above the treeline
  let rockN = fbm2(xz * (1.0 / 55.0) + vec2f(2.0, 5.0), 3);
  var rock = smoothstep(1.2, 1.85, slope + rockN * 0.35 - lap * 1.5);
  // above the treeline: alpine meadow on the gentler ground, rock and scree on the rest
  rock = max(rock, (1.0 - alpine) * smoothstep(-0.2, 0.3, rockN + slope * 0.7 - 0.42));
  rock *= F.biome.x;

  let snowN = fbm2(xz * (1.0 / 130.0) + vec2f(8.0, 3.0), 3);
  var snow = smoothstep(F.forest2.z - 40.0, F.forest2.z + 90.0, above + snowN * 140.0 + lap * 400.0);
  // snow slides off steep faces, leaving dark rock ribs between the snowfields
  snow *= 1.0 - smoothstep(0.55, 0.95, slope + snowN * 0.25);

  textureStore(dstA, id.xy, u32(B.level), vec4f(h, grad, lap));
  textureStore(dstB, id.xy, u32(B.level), vec4f(clamp(dens, 0.0, 1.0), conif, clamp(rock, 0.0, 1.0), clamp(snow, 0.0, 1.0)));
}
`;

// Terrain heights at the points the flight controller asks about (async readback).
const HEIGHT_PROBE = FRAME_WGSL + /* wgsl */ `
@group(0) @binding(0) var<uniform> F: Frame;
struct Probe { p: array<vec4f, ${PROBE_N}> };
@group(0) @binding(1) var<uniform> Q: Probe;
@group(0) @binding(2) var<storage, read_write> outH: array<f32, ${PROBE_N}>;
` + NOISE_WGSL + TERRAIN_FUNCS + /* wgsl */ `
@compute @workgroup_size(${PROBE_N})
fn main(@builtin(local_invocation_index) k: u32) {
  let xz = Q.p[k].xy;
  outH[k] = max(terrainHeight(xz, 4.0), waterLevel(xz.y));
}
`;

// ---- js/wgsl/forest.js ----
// Individual trees. Every cell of a jittered grid (spacing F.forest.y) may hold one tree;
// whether it does, its species and its size come from the land-cover masks at the trunk and
// a per-cell hash, so the vertex and fragment stages always agree on the same tree.
// Conifers are cones, broadleaf crowns are domes (flatter umbrellas in the tropics). The
// canopy surface is the highest crown over a point; its gradient is analytic.
// Requires TERRAIN_FUNCS and the clipmap lookups (clipSampleWGSL).
const FOREST_FUNCS = /* wgsl */ `
struct Tree {
  pos: vec2f,
  top: f32,      // crown apex above the ground (m)
  base: f32,     // lowest visible crown edge (m)
  r: f32,        // crown radius (m)
  conifer: bool,
  ok: bool,
  tint: f32,     // per-tree brightness variation, 0..1
  hue: f32,      // per-tree colour pick, 0..1
  seed: f32,     // decorrelates the crown texture of neighbouring trees
};

fn unit16(h: u32) -> f32 { return f32(h & 0xFFFFu) * (1.0 / 65535.0); }

// Land-cover masks at a trunk: one level, chosen from the trunk position only.
fn treeMasks(pos: vec2f) -> vec2f {
  let L = min(i32(ceil(clipFinest(pos) - 0.001)), CLIP_L - 1);
  return clipB1(pos, L).xy;
}

fn treeCell(cell: vec2i, sampleMasks: bool, dens0: f32, conif0: f32) -> Tree {
  let sp = F.forest.y;
  let h0 = pcgHash((u32(cell.x) * 73856093u) ^ (u32(cell.y) * 19349663u + seedU() + 0x5bd1e995u));
  let h1 = pcgHash(h0 ^ 0x68e31da4u);
  let h2 = pcgHash(h1 ^ 0xb5297a4du);
  var t: Tree;
  t.pos = (vec2f(cell) + 0.5 + (vec2f(unit16(h0), unit16(h0 >> 16u)) - 0.5) * 0.8) * sp;
  var m = vec2f(dens0, conif0);
  if (sampleMasks) { m = treeMasks(t.pos); }
  t.ok = unit16(h1) < m.x;
  t.conifer = unit16(h1 >> 16u) < m.y;
  let trop = F.biome.w;
  // sparse stands are younger and shorter; a few emergents tower over a tropical canopy
  var sz = (0.7 + 0.6 * unit16(h2)) * mix(0.55, 1.0, smoothstep(0.0, 0.55, m.x));
  sz *= 1.0 + trop * 0.55 * step(0.93, unit16(h2 >> 16u));
  t.top = F.forest.z * sz * select(1.0, 1.1, t.conifer);
  // broadleaf crowns about as wide as the spacing, so neighbours close into one canopy;
  // the 3x3 cell search holds radii up to 1.1 spacings
  t.r = sp * select(min(mix(0.95, 1.0, trop) * pow(sz, 0.6), 1.08), 0.52 * pow(sz, 0.65), t.conifer);
  // broadleaf domes taper down to the understory, so a closed stand has no crown walls
  t.base = select(min(understoryH(m.x), t.top * 0.7), t.top * 0.2, t.conifer);
  let h3 = pcgHash(h2 ^ 0x1b873593u);
  t.tint = unit16(h3);
  t.hue = unit16(h3 >> 16u);
  t.seed = f32(h0 & 1023u);
  return t;
}

// (height above ground, d/dx, d/dz) of one crown at p, or height -1 outside it.
fn crownAt(t: Tree, p: vec2f) -> vec3f {
  let dv = p - t.pos;
  let d2 = dot(dv, dv);
  if (d2 >= t.r * t.r) { return vec3f(-1.0, 0.0, 0.0); }
  let d = max(sqrt(d2), 1e-3);
  let x = d / t.r;
  let span = t.top - t.base;
  var y: f32;
  var dydd: f32;
  if (t.conifer) {
    // slightly convex cone: a spruce or fir seen from above
    let px = pow(x, 0.85);
    y = t.top - span * px;
    dydd = -span * 0.85 * px / (x * t.r);
  } else {
    // paraboloid: a rounded top with sides that meet the neighbours at a gentle angle
    y = t.base + span * (1.0 - x * x);
    dydd = -span * 2.0 * x / t.r;
  }
  return vec3f(y, dv / d * dydd);
}

struct Canopy { y: f32, g: vec2f, x: f32, hit: bool, tree: Tree };

// Lower branches, saplings and shrubs that fill the gaps between crowns in a closed stand.
fn understoryH(dens: f32) -> f32 {
  return F.forest.z * 0.58 * smoothstep(0.35, 0.85, dens);
}

// Highest crown over p among the 3x3 neighbouring cells.
fn canopyAt(p: vec2f, sampleMasks: bool, dens0: f32, conif0: f32) -> Canopy {
  let sp = F.forest.y;
  let c0 = vec2i(floor(p / sp));
  var best: Canopy;
  best.y = 0.0;
  best.hit = false;
  for (var j = -1; j <= 1; j++) {
    for (var i = -1; i <= 1; i++) {
      let t = treeCell(c0 + vec2i(i, j), sampleMasks, dens0, conif0);
      if (!t.ok) { continue; }
      let c = crownAt(t, p);
      if (c.x > best.y) {
        best.y = c.x;
        best.g = c.yz;
        best.x = length(p - t.pos) / t.r;
        best.hit = true;
        best.tree = t;
      }
    }
  }
  return best;
}

// Fraction of sunlight reaching a point y0 metres above the ground at p.
// A closed stand shades its floor and its lower crowns from density. Marching the
// neighbouring crowns as well reran the tree field several times per pixel, which
// was most of the remaining landscape cost, and from the air those shadows are
// smaller than the crown shading already drawn here.
fn canopyShadow(y0: f32, L: vec3f, dens: f32) -> f32 {
  if (dens < 0.004) { return 1.0; }
  let top = max(F.forest.z, 1.0);
  let sunk = smoothstep(-0.02, 0.35, L.y);
  let depth = smoothstep(top * 0.95, top * 0.2, y0) * smoothstep(0.05, 0.5, dens);
  return clamp(1.0 - depth * mix(0.78, 0.34, sunk), 0.0, 1.0);
}

// ---- foliage colour (linear albedo) ------------------------------------------------
fn coniferAlbedo(t: Tree) -> vec3f {
  let base = mix(vec3f(0.020, 0.036, 0.024), vec3f(0.034, 0.052, 0.030), t.hue);
  return base * (0.75 + 0.5 * t.tint);
}
fn summerAlbedo(t: Tree) -> vec3f {
  let yellow = vec3f(0.062, 0.088, 0.026);
  let blue = vec3f(0.036, 0.068, 0.032);
  return mix(blue, yellow, t.hue) * (0.78 + 0.45 * t.tint);
}
fn autumnAlbedo(t: Tree) -> vec3f {
  let k = fract(t.hue * 7.31 + t.tint * 0.37);
  var c = vec3f(0.045, 0.065, 0.026);                       // still green
  if (k < 0.12) { c = vec3f(0.17, 0.030, 0.016); }            // red maple
  else if (k < 0.20) { c = vec3f(0.19, 0.050, 0.018); }       // scarlet
  else if (k < 0.40) { c = vec3f(0.21, 0.085, 0.018); }       // sugar maple orange
  else if (k < 0.58) { c = vec3f(0.19, 0.130, 0.025); }       // birch / aspen gold
  else if (k < 0.68) { c = vec3f(0.10, 0.095, 0.028); }       // turning yellow-green
  else if (k < 0.82) { c = vec3f(0.085, 0.045, 0.020); }      // oak russet
  return c * (0.75 + 0.45 * t.tint);
}
fn tropicalAlbedo(t: Tree) -> vec3f {
  var c = mix(vec3f(0.040, 0.080, 0.026), vec3f(0.075, 0.105, 0.030), t.hue);
  // pale new flush and the odd flowering crown
  if (t.tint > 0.92) { c = vec3f(0.09, 0.115, 0.045); }
  if (t.tint > 0.985 && t.hue > 0.5) { c = vec3f(0.26, 0.20, 0.05); }
  return c * (0.8 + 0.35 * t.tint);
}
fn treeAlbedo(t: Tree) -> vec3f {
  if (t.conifer) { return coniferAlbedo(t); }
  if (F.biome.w > 0.5) { return tropicalAlbedo(t); }
  // only part of a stand turns at once
  let turned = smoothstep(0.0, 0.35, F.forest2.x - fract(t.seed * 0.61803) * 0.65);
  return mix(summerAlbedo(t), autumnAlbedo(t), turned);
}
// Mean foliage albedo of a stand, for the far field.
fn standAlbedo(conif: f32) -> vec3f {
  let con = vec3f(0.026, 0.044, 0.027);
  var broad = vec3f(0.049, 0.078, 0.029);
  if (F.biome.w > 0.5) { broad = vec3f(0.056, 0.092, 0.029); }
  let autumn = vec3f(0.135, 0.074, 0.022);
  broad = mix(broad, autumn, smoothstep(0.0, 1.0, F.forest2.x) * 0.82);
  return mix(broad, con, conif);
}
// Stand albedo with the mosaic of stands seen from afar: patches of different species,
// ages and (in autumn) maple-red against birch-gold hillsides.
fn standAlbedoAt(xz: vec2f, conif: f32) -> vec3f {
  let n1 = fbm2(xz * (1.0 / 260.0) + vec2f(3.7, 1.9), 3);
  let n2 = snoise(xz * (1.0 / 60.0) + vec2f(8.1, 4.4));
  var a = standAlbedo(clamp(conif + n1 * 0.2, 0.0, 1.0)) * (0.82 + 0.18 * n2 + 0.2 * n1);
  let aut = smoothstep(0.0, 1.0, F.forest2.x) * (1.0 - conif);
  let tint = mix(vec3f(1.25, 0.72, 0.8), vec3f(0.92, 1.2, 1.1), smoothstep(-0.45, 0.45, n1 + n2 * 0.35));
  return a * mix(vec3f(1.0), tint, aut);
}
`;

// ---- js/wgsl/rain.js ----
// Rain, snow, and lightning for an aerial camera.
// The ocean frame stamps ripples into the sea. Here the aircraft is inside the
// weather, so drops fill a column around the camera, a screen veil covers the
// valley, and lightning lights the sky and the land. The uniform block matches
// the Float32Array written in main.js.

const MAX_DROPS = 8192;

const RAIN_STRUCT = /* wgsl */ `
struct RainU {
  cam: vec4f,     // xyz metres, w = time (s)
  wind: vec4f,    // xy direction, z speed (m/s), w intensity
  amt: vec4f,     // wetness, snow (0 or 1), lightning flash, style (0 rain, 1 storm, 2 snow)
  bolt: vec4f,    // xy direction, z seed, w enabled
  sim: vec4f,     // -, dt, active drops, slant
  pad0: vec4f,
  atmo: vec4f,    // extra fog, sun scale, sky darken, gust
  dropP: vec4f,   // fall speed, box radius, column depth, -
};
`;

const RAIN_FUNCS = /* wgsl */ `
fn rainBolt(dir: vec3f) -> vec3f {
  if (Rain.bolt.w < 0.5 || Rain.amt.z < 0.015) { return vec3f(0.0); }
  let horiz = normalize(dir.xz + vec2f(1e-5, 0.0));
  let aim = normalize(Rain.bolt.xy + vec2f(1e-5, 0.0));
  let ang = acos(clamp(dot(horiz, aim), -1.0, 1.0));
  let yq = floor(dir.y * 46.0 + Rain.bolt.z);
  let jag = (fract(sin(yq * 91.73) * 43758.5453) - 0.5) * 0.10;
  let above = smoothstep(-0.08, 0.02, dir.y) * smoothstep(0.94, 0.22, dir.y);
  let d = abs(ang - jag);
  let core = exp(-d * d / 0.00028) * above;
  let glow = exp(-d * d / 0.009) * above;
  let branch = exp(-abs(ang - jag - 0.11) * 26.0) * smoothstep(0.02, 0.16, dir.y) * smoothstep(0.62, 0.18, dir.y);
  return vec3f(0.75, 0.84, 1.0) * (core * 22.0 + glow * 1.15 + branch * 3.2) * Rain.amt.z;
}

fn applyRainSky(dir: vec3f, L: vec3f) -> vec3f {
  let storm = select(0.0, 1.0, Rain.amt.w > 0.5 && Rain.amt.w < 1.5);
  var o = L * mix(1.0, Rain.atmo.z, 0.85) * mix(1.0, Rain.atmo.y, 0.8);
  o += rainBolt(dir);
  o += vec3f(0.55, 0.68, 1.0) * Rain.amt.z * (0.34 + 0.16 * storm);
  return o;
}
`;

const RAIN_DROP_INIT = RAIN_STRUCT + /* wgsl */ `
struct Drop { pos: vec4f, vel: vec4f }
@group(0) @binding(0) var<uniform> Rain: RainU;
@group(0) @binding(1) var<storage, read_write> drops: array<Drop>;

fn h01(n: u32) -> f32 {
  var x = n * 747796405u + 2891336453u;
  x = ((x >> ((x >> 28u) + 4u)) ^ x) * 277803737u;
  x = (x >> 22u) ^ x;
  return f32(x) / 4294967295.0;
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id: vec3u) {
  if (id.x >= ${MAX_DROPS}u) { return; }
  let a = h01(id.x * 17u + 3u);
  let b = h01(id.x * 29u + 11u);
  let c = h01(id.x * 47u + 19u);
  let ang = a * 6.2831853;
  let rad = sqrt(b) * Rain.dropP.y;
  let y = Rain.cam.y + Rain.dropP.z * (0.28 - c);
  let pos = vec3f(Rain.cam.x + cos(ang) * rad, y, Rain.cam.z + sin(ang) * rad);
  let gust = 0.85 + 0.15 * a;
  let horiz = Rain.wind.xy * Rain.wind.z * Rain.sim.w * gust;
  drops[id.x].pos = vec4f(pos, a);
  drops[id.x].vel = vec4f(horiz.x, -Rain.dropP.x, horiz.y, 2.0);
}
`;

const RAIN_DROP_UPDATE = RAIN_STRUCT + FRAME_WGSL + /* wgsl */ `
struct Drop { pos: vec4f, vel: vec4f }
@group(0) @binding(0) var<uniform> Rain: RainU;
@group(0) @binding(1) var<uniform> F: Frame;
@group(0) @binding(2) var<storage, read_write> drops: array<Drop>;

fn h01(n: f32) -> f32 {
  return fract(sin(n * 127.1 + 311.7) * 43758.5453);
}

fn respawn(id: u32, seed: f32) -> vec4f {
  let n = h01(f32(id) * 0.17 + Rain.cam.w * 1.7 + seed * 9.1);
  let m = h01(f32(id) * 0.93 + seed * 4.2 + 2.3);
  let k = h01(f32(id) * 1.7 + Rain.cam.w * 0.37 + 5.5);
  let ang = n * 6.2831853;
  let rad = sqrt(m) * Rain.dropP.y;
  let xz = F.camPos.xz + vec2f(cos(ang), sin(ang)) * rad;
  let y = F.camPos.y + Rain.dropP.z * (0.28 - k);
  return vec4f(xz.x, y, xz.y, seed);
}

@compute @workgroup_size(64)
fn main(@builtin(global_invocation_id) id: vec3u) {
  let live = u32(Rain.sim.z);
  if (id.x >= live) { return; }
  var d = drops[id.x];
  let snow = Rain.amt.y > 0.5;
  let gust = 0.78 + 0.22 * sin(Rain.cam.w * (0.7 + Rain.atmo.w) + d.pos.w * 6.2831853);
  let drift = select(0.0, sin(Rain.cam.w * 1.15 + d.pos.w * 6.2831853) * 0.9, snow);
  let horiz = Rain.wind.xy * Rain.wind.z * Rain.sim.w * gust + vec2f(drift, drift * 0.35);
  let fall = Rain.dropP.x * (0.82 + 0.36 * d.pos.w);
  d.vel = vec4f(horiz.x, -fall, horiz.y, 2.0);
  let dt = min(Rain.sim.y, 0.05);
  d.pos = vec4f(d.pos.xyz + d.vel.xyz * dt, d.pos.w);
  let away = length(d.pos.xz - F.camPos.xz);
  let below = F.camPos.y - d.pos.y;
  let above = d.pos.y - F.camPos.y;
  if (away > Rain.dropP.y * 1.25 || below > Rain.dropP.z * 1.05 || above > Rain.dropP.z * 0.45) {
    d.pos = respawn(id.x, d.pos.w);
    d.vel = vec4f(horiz.x, -Rain.dropP.x, horiz.y, 2.0);
  }
  drops[id.x] = d;
}
`;

const RAIN_VS = /* wgsl */ `
struct VO { @builtin(position) pos: vec4f, @location(0) ndc: vec2f };

fn hash21(p: vec2f) -> f32 {
  let q = fract(p * vec2f(123.34, 345.45));
  let r = q + dot(q, q.yx + 34.345);
  return fract(r.x * r.y);

fn noise(p: vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);
  let u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i), hash21(i + vec2f(1.0, 0.0)), u.x),
    mix(hash21(i + vec2f(0.0, 1.0)), hash21(i + vec2f(1.0, 1.0)), u.x),

const AP_MAX: f32 = ${AP_MAX_KM}.0;
const EARTH_R: f32 = 6371000.0;

struct VSOut {
  @builtin(position) pos: vec4f,
  @location(0) rel: vec3f,     // surface position relative to the camera (with Earth curvature)
  @location(1) xz: vec2f,      // world ground position

  let deg = acos(clamp(dot(lite, -moon), -1.0, 1.0)) * (180.0 / PI);

// Mountain shadows: a short march for the nearest ridge, then long steps that still
// reach a few kilometres. The shadow only has to catch whole slopes, so samples stay
// on coarse clip levels instead of the 2 m map.
fn terrainShadow(p: vec3f, L: vec3f) -> f32 {
  if (L.y > 0.8) { return 1.0; }

  var t = 30.0;

  // kilometres; the dropped samples were the expensive part of every landscape pixel.
  for (var i = 0; i < 8; i++) {
    let q = p + L * t;
    if (q.y > ceiling) { break; }
    let texel = max(t * 0.22, 24.0);
    let lf = clamp(log2(texel / CLIP_T0), 0.0, f32(CLIP_L - 1));
    let h = clipHeight(q.xz, ceil(lf));
    let gap = q.y - h;
    res = min(res, gap / (t * 0.05) + 0.5);
    if (res <= 0.0) { return 0.0; }
    t *= 1.72;

// sampled once per frame instead of rebuilt inside every landscape pixel.
fn cloudShade(world: vec3f) -> f32 {

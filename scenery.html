    nextBolt -= dt;
    if (nextBolt > 0) return;
    const mean = Math.max(1.4, 18 * (1 - rate) + 1.5);
    nextBolt = mean * (0.4 + Math.random() * 0.9);
    const az = Math.random() * Math.PI * 2;
    boltX = Math.cos(az);
    boltZ = Math.sin(az);
    boltSeed = Math.random() * 200;
    boltDur = 0.14 + Math.random() * 0.2;
    boltLife = boltDur;
    boltPower = 0.65 + Math.random() * 0.55;
    boltFlash = boltPower;
    boltOn = 1;
  }
  function writeRainUniforms(dt) {
    const amount = rainAmount();
    const style = P.rainStyle === 'snow' ? 2 : P.rainStyle === 'thunderstorm' ? 1 : 0;
    const storm = style === 1 ? 1 : 0;
    const snow = style === 2 ? 1 : 0;
    const dir = P.cloudWindDir * D2R;
    const speed = Math.max(2, P.cloudWindSpeed);
    rainF[0] = cam.x; rainF[1] = cam.y; rainF[2] = cam.z; rainF[3] = simTime;
    rainF[4] = Math.sin(dir); rainF[5] = -Math.cos(dir); rainF[6] = speed; rainF[7] = amount;
    rainF[8] = amount * (1 - snow); rainF[9] = snow; rainF[10] = boltFlash; rainF[11] = style;
    rainF[12] = boltX; rainF[13] = boltZ; rainF[14] = boltSeed; rainF[15] = boltOn;
    const count = snow ? 900 + amount * amount * 6800 : 420 + amount * amount * 6200;
    rainActive = amount <= 0.004 ? 0 : Math.min(MAX_DROPS, Math.floor(count));
    rainF[16] = 0; rainF[17] = dt; rainF[18] = rainActive;
    rainF[19] = Math.min(1, 0.16 + amount * 0.4 + storm * 0.18 + snow * 0.22);
    rainF[20] = 0; rainF[21] = 0; rainF[22] = 0; rainF[23] = 0;
    const shade = (storm * 0.22 + 0.42) * (1 - snow * 0.45);
    const sunCut = (0.4 + storm * 0.22) * (1 - snow * 0.35);
    rainF[24] = 0;
    rainF[25] = amount > 0 ? Math.max(0.34, 1 - amount * sunCut) : 1;
    rainF[26] = amount > 0 ? Math.max(0.28, 1 - amount * shade) : 1;
    rainF[27] = 0.3 + storm * 0.35;
    rainF[28] = snow ? 1.3 + amount * 0.9 : 10 + amount * 7;
    rainF[29] = 20 + amount * (snow ? 28 : 22);
    rainF[30] = 40 + amount * (snow ? 70 : 100);
    rainF[31] = 0;
    device.queue.writeBuffer(rainUBO, 0, rainF);
  }
  function encodeRain(cp) {
    if (!rainInited) {
      cp.setPipeline(rainInitPipe);
      cp.setBindGroup(0, bgRainInit);
      cp.dispatchWorkgroups(Math.ceil(MAX_DROPS / 64));
      rainInited = true;
      return;
    }
    if (rainActive > 0) {
      cp.setPipeline(rainDropPipe);
      cp.setBindGroup(0, bgRainDrop);
      cp.dispatchWorkgroups(Math.ceil(rainActive / 64));
    }
  }
  function frame(now) {
    if (shooting) return;  // paused while a screenshot is read back
    requestAnimationFrame(frame);
    resize();
    let dt = Math.min(0.1, (now - last) / 1000);
    last = now;
    fpsAcc += dt; fpsN++; fpsT += dt;
    if (fpsT > 0.5) {
      const fps = fpsN / fpsAcc;
      hudFps.textContent = `${hudScene}  |  ${fps.toFixed(0)} fps  ${(1000 / fps).toFixed(2)} ms` +
        (hasTS ? `  |  GPU ${gpuMs.toFixed(2)} ms` : '') + `  |  ${nodeCount} nodes  ${W}x${H}` +
        `  |  alt ${cam.y.toFixed(0)} m  agl ${(cam.y - groundUnder).toFixed(0)} m`;
      fpsAcc = 0; fpsN = 0; fpsT = 0;
    }
    advanceTimeLapse(dt);
    updateLapseRain();
    updateDynamicClouds();
    updateDynamicStars();
    updateFollowedRain();
    updateRainClouds();
    if (fixedDt) dt = fixedDt;
    advanceCloudMotion(dt);
    updateTour(dt);
    updateCamera(dt);
    simTime += dt;
    if (simTime > 4096) simTime -= 4096;
    frameIndex++;
    updateLightning(dt);
    writeRainUniforms(dt);

    writeFrame(simTime);
    const shadowTexel = SHADOW_SPAN / SHADOW_N;
    shadowF[0] = Math.floor((cam.x - SHADOW_SPAN * 0.5) / shadowTexel) * shadowTexel;
    shadowF[1] = Math.floor((cam.z - SHADOW_SPAN * 0.5) / shadowTexel) * shadowTexel;
    shadowF[2] = shadowTexel;
    shadowF[3] = SHADOW_SPAN;
    // the readers must see the origin the map was baked at
    if ((frameIndex & 3) === 0) device.queue.writeBuffer(shadowUBO, 0, shadowF);
    selectAll();
    if (nodeCount) device.queue.writeBuffer(instBuf, 0, instData, 0, nodeCount * 4);

    const enc = device.createCommandEncoder();
    const cp = enc.beginComputePass(computeDesc);
    if (needLUT) {
      atmoF[0] = P.haze;
      device.queue.writeBuffer(atmoUBO, 0, atmoF);
      cp.setPipeline(transPipe);
      cp.setBindGroup(0, bgTrans);
      cp.dispatchWorkgroups(256 / 8, 64 / 8);
      cp.setPipeline(msPipe);
      cp.setBindGroup(0, bgMS);
      cp.dispatchWorkgroups(32 / 8, 32 / 8);
      needLUT = false;
    }
    encodeClips(cp);
    let doProbe = false;
    if (!probePending) {
      writeProbes();
      cp.setPipeline(probePipe);
      cp.setBindGroup(0, bgProbe);
      cp.dispatchWorkgroups(1);
      doProbe = true;
    }
    // The sky-view LUT depends on the sun, the haze and the camera altitude, not on the
    // view direction. Rebuilding it every frame costs the same on a still afternoon as
    // during a time lapse, so it is refreshed only when one of those changes.
    const skySun = (skyUsesPlace() && liveSky) ? liveSky.sunDirection : horizonDirection(manualSunElev(), P.sunAzim);
    const skyStamp = P.haze.toFixed(2) + '|' + (Math.max(cam.y, 10) * 0.001).toFixed(2) + '|' +
      skySun[0].toFixed(3) + '|' + skySun[1].toFixed(3) + '|' + skySun[2].toFixed(3);
    if (skyStamp !== skyViewStamp) {
      skyViewStamp = skyStamp;
      cp.setPipeline(skyViewPipe);
      cp.setBindGroup(0, bgSkyView);
      cp.dispatchWorkgroups(Math.ceil(SKY_W / 8), Math.ceil(SKY_H / 8));
    }
    cp.setPipeline(apPipe);
    cp.setBindGroup(0, bgAP);
    cp.dispatchWorkgroups(Math.ceil(AP_RES / 8), Math.ceil(AP_RES / 8));
    encodeRain(cp);
    // Cloud shadows and water reflections are baked at a fixed small size, so they do not
    // get cheaper when the picture scales down. Both move slowly, so they take turns, each
    // refreshed every fourth frame.
    if ((frameIndex & 3) === 0) {
      cp.setPipeline(shadowPipe);
      cp.setBindGroup(0, bgShadow);
      cp.dispatchWorkgroups(SHADOW_N / 8, SHADOW_N / 8);
    }
    if ((frameIndex & 3) === 2) {
      cp.setPipeline(reflPipe);
      cp.setBindGroup(0, bgRefl);
      cp.dispatchWorkgroups(REFL_W / 8, REFL_H / 8);
    }
    {
      const sp = Math.max(frameF[121], 1);
      const dim = Math.ceil(2 * TREE_RANGE / sp) + 2;
      treeGenI[0] = Math.floor((cam.x - TREE_RANGE) / sp);
      treeGenI[1] = Math.floor((cam.z - TREE_RANGE) / sp);
      treeGenU[2] = dim; treeGenU[3] = 0;
      device.queue.writeBuffer(treeGenUBO, 0, treeGenData);
      device.queue.writeBuffer(treeArgs, 0, treeArgsInit);
      cp.setPipeline(treeLightPipe);
      cp.setBindGroup(0, bgTreeLight);
      cp.dispatchWorkgroups(1);
      cp.setPipeline(treeGenPipe);
      cp.setBindGroup(0, bgTreeGen);
      cp.dispatchWorkgroups(Math.ceil(dim / TREE_GEN_GROUP), Math.ceil(dim / TREE_GEN_GROUP));
    }
    cp.end();

    const rp = enc.beginRenderPass(mainPass);
    if (nodeCount) {
      rp.setPipeline(landPipe);
      rp.setBindGroup(0, bgLand);
      rp.setVertexBuffer(0, instBuf);
      rp.setIndexBuffer(idxBuf, 'uint16');
      rp.drawIndexed(GRID * GRID * 6, nodeCount);
    }
    rp.setPipeline(treeNearPipe);
    rp.setBindGroup(0, bgTreeNear);
    rp.drawIndirect(treeArgs, 0);
    rp.setPipeline(treeFarPipe);
    rp.setBindGroup(0, bgTreeFar);
    rp.drawIndirect(treeArgs, 16);
    rp.setPipeline(skyPipe);
    rp.setBindGroup(0, bgSky);
    rp.draw(3);
    if (rainActive > 0) {
      rp.setPipeline(rainDrawPipe);
      rp.setBindGroup(0, bgRainDraw);
      rp.draw(rainActive * 6);
      rp.setPipeline(rainMistPipe);
      rp.setBindGroup(0, bgRainMist);
      rp.draw(3);
    }
    rp.end();

    for (let m = 0; m < BLOOM_LEVELS; m++) {
      const p = enc.beginRenderPass(downPasses[m]);
      p.setPipeline(downPipe);
      p.setBindGroup(0, downBGs[m]);
      p.draw(3);
      p.end();
    }
    for (let i = 0; i < upPasses.length; i++) {
      const p = enc.beginRenderPass(upPasses[i]);
      p.setPipeline(upPipe);
      p.setBindGroup(0, upBGs[i]);
      p.draw(3);
      p.end();
    }

    const fade = tour.fade * tour.fade * (3 - 2 * tour.fade);
    compData[0] = P.exposure * fade; compData[1] = P.bloom; compData[2] = frameIndex % 64; compData[3] = 0.10;
    compData[4] = 1.04; compData[5] = 1.05; compData[6] = 0.0; compData[7] = presentSharpen;
    device.queue.writeBuffer(compUBO, 0, compData);
    const swapTex = ctx.getCurrentTexture();
    compPass.colorAttachments[0].view = swapTex.createView();
    const pc = enc.beginRenderPass(compPass);
    pc.setPipeline(compPipe);
    pc.setBindGroup(0, bgComp);
    pc.draw(3);
    pc.end();

    if (doProbe) enc.copyBufferToBuffer(probeOut, 0, probeRead, 0, PROBE_N * 4);
    let doTreeRead = false;
    if (!treeArgsPending && (frameIndex & 63) === 0) {
      enc.copyBufferToBuffer(treeArgs, 0, treeArgsRead, 0, 32);
      doTreeRead = true;
    }
    let doTs = false;
    if (hasTS && !tsPending && (frameIndex & 7) === 0) {
      enc.resolveQuerySet(tsQuery, 0, 4, tsResolve, 0);
      enc.copyBufferToBuffer(tsResolve, 0, tsRead, 0, 32);
      doTs = true;
    }
    let readBuf = null;
    if (shotName && shotIdx < shotSeq && tour.state === 'run' && frameIndex >= shotFrames + shotIdx) {
      shooting = true;
      const bpr = Math.ceil(W * 4 / 256) * 256;
      readBuf = device.createBuffer({ size: bpr * H, usage: GU.MAP_READ | GU.COPY_DST });
      enc.copyTextureToBuffer({ texture: swapTex }, { buffer: readBuf, bytesPerRow: bpr }, [W, H]);
    }
    submitList[0] = enc.finish();
    device.queue.submit(submitList);
    if (doProbe) { probePending = true; probeRead.mapAsync(GPUMapMode.READ).then(onProbe, onProbeFail); }
    if (doTreeRead) {
      treeArgsPending = true;
      treeArgsRead.mapAsync(GPUMapMode.READ).then(() => {
        const a = new Uint32Array(treeArgsRead.getMappedRange());
        window.__trees = [a[1], a[5]];
        treeArgsRead.unmap();
        treeArgsPending = false;
      }, () => { treeArgsPending = false; });
    }
    if (doTs) { tsPending = true; tsRead.mapAsync(GPUMapMode.READ).then(onTsMapped, onTsFail); }
    if (readBuf) saveShot(readBuf, Math.ceil(W * 4 / 256) * 256);
    considerPace(dt);
  }

  async function saveShot(buf, bpr) {
    await buf.mapAsync(GPUMapMode.READ);
    const src = new Uint8Array(buf.getMappedRange());
    const img = new ImageData(W, H);
    const bgra = swapFormat === 'bgra8unorm';
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const s = y * bpr + x * 4, d = (y * W + x) * 4;
        img.data[d] = src[s + (bgra ? 2 : 0)];
        img.data[d + 1] = src[s + 1];
        img.data[d + 2] = src[s + (bgra ? 0 : 2)];
        img.data[d + 3] = 255;
      }
    }
    buf.unmap();
    const oc = new OffscreenCanvas(W, H);
    oc.getContext('2d').putImageData(img, 0, 0);
    const blob = await oc.convertToBlob({ type: 'image/png' });
    const nm = shotSeq > 1 ? shotName.replace('.png', `_${shotIdx}.png`) : shotName;
    await fetch('/__shot?name=' + encodeURIComponent(nm), { method: 'POST', body: blob });
    log('shot saved ' + nm + ' gpu ' + gpuMs.toFixed(2) + 'ms nodes ' + nodeCount + ' alt ' + cam.y.toFixed(0) + ' agl ' + (cam.y - groundUnder).toFixed(0));
    shotIdx++;
    shooting = false;
    if (shotIdx < shotSeq) { requestAnimationFrame(frame); return; }
    if (shotSeq > 1) await fetch('/__shot?name=' + encodeURIComponent(shotName), { method: 'POST', body: blob });
    document.title = 'SHOT DONE';
    if (qs.get('keep') === '1') requestAnimationFrame(frame);
  }

  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
}

main().catch((e) => {
  const msg = 'init failed: ' + (e && e.stack || e);
  const el = document.getElementById('err');
  if (el) { el.style.display = 'block'; el.textContent = msg; }
  log(msg);
});


</script>
</body>
</html>
